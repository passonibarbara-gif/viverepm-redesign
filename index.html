      checkin: gd.checkin, checkout: gd.checkout,
      note: bd.note, documento: bd.documento,
      adulti: gd.adulti||1, bambini: gd.bambini||0, animali: gd.animali||0,
      dichiaraPagato: !!(prop && prop.linkPagamento)
    });
    state.guestWizardStep = 1;
    state.guestDates = {checkin:'', checkout:'', adulti:1, bambini:0, animali:0};
    state.guestBookingData = {nomeProprio:'', cognome:'', telefono:'', indirizzo:'', note:'', documento:null};
  });

  const guestGotoManage = document.querySelector('[data-guest-goto-manage]');
  if(guestGotoManage) guestGotoManage.addEventListener('click', ()=>{ state.guestManageMode = true; render(); });
  const guestManageExit = document.querySelector('[data-guest-manage-exit]');
  if(guestManageExit) guestManageExit.addEventListener('click', ()=>{ state.guestManageMode = false; state.guestManagePhone = null; state.guestManageSelected = null; render(); });
  const guestManageReset = document.querySelector('[data-guest-manage-reset]');
  if(guestManageReset) guestManageReset.addEventListener('click', ()=>{ state.guestManagePhone = null; state.guestManageSelected = null; render(); });
  const guestManageDeselect = document.querySelector('[data-guest-manage-deselect]');
  if(guestManageDeselect) guestManageDeselect.addEventListener('click', ()=>{ state.guestManageSelected = null; render(); });
  document.querySelectorAll('[data-guest-manage-pick]').forEach(b=>b.addEventListener('click', ()=>{
    const [propId, bookingId] = b.getAttribute('data-guest-manage-pick').split('::');
    state.guestManageSelected = {propId, bookingId};
    render();
  }));

  const guestLookupForm = document.getElementById('guestLookupForm');
  if(guestLookupForm) guestLookupForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(guestLookupForm);
    state.guestManagePhone = (fd.get('telefono')||'').trim();
    state.guestManageSelected = null;
    render();
  });

  document.querySelectorAll('[data-segna-pagamento-booking]').forEach(b=>b.addEventListener('click', ()=>openModal('pagamentoBooking', null, state.selectedId, {bookingId:b.getAttribute('data-segna-pagamento-booking')})));

  document.querySelectorAll('.msg-form-booking').forEach(f=>{
    f.addEventListener('submit', ev=>{
      ev.preventDefault();
      const [propId, bookingId] = f.getAttribute('data-booking-msg-form').split('::');
      const autore = f.getAttribute('data-autore');
      const input = f.querySelector('[name=testo]');
      const testo = input.value.trim();
      if(!testo) return;
      sendMessageBooking(propId, bookingId, autore, testo);
    });
  });

  document.querySelectorAll('.msg-form').forEach(f=>{
    f.addEventListener('submit', ev=>{
      ev.preventDefault();
      const propId = f.getAttribute('data-msg-form');
      const autore = f.getAttribute('data-autore');
      const input = f.querySelector('[name=testo]');
      const testo = input.value.trim();
      if(!testo) return;
      sendMessage(propId, autore, testo);
    });
  });
  document.querySelectorAll('[data-msg-thread]').forEach(el=>{ el.scrollTop = el.scrollHeight; });

  // modal close
  const overlay = document.querySelector('[data-close-overlay]');
  if(overlay){
    overlay.addEventListener('click', (ev)=>{ if(ev.target===overlay) closeModal(); });
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
    document.querySelector('[data-stop]')?.addEventListener('click', ev=>ev.stopPropagation());
  }

  const propForm = document.getElementById('propForm');
  if(propForm){
    const clienteSelectEl = document.getElementById('clienteSelect');
    if(clienteSelectEl) clienteSelectEl.addEventListener('change', ()=>{
      const box = document.getElementById('newClienteFields');
      if(box) box.style.display = clienteSelectEl.value ? 'none' : 'block';
    });
    const dispCheckEl = document.getElementById('dispCheck');
    if(dispCheckEl) dispCheckEl.addEventListener('change', ()=>{
      const box = document.getElementById('caratteristicheField');
      if(box) box.style.display = dispCheckEl.checked ? 'block' : 'none';
    });
    const locCheckEl = document.getElementById('locCheck');
    if(locCheckEl) locCheckEl.addEventListener('change', ()=>{
      const box = document.getElementById('locazioneField');
      if(box) box.style.display = locCheckEl.checked ? 'block' : 'none';
    });
    propForm.addEventListener('submit', async ev=>{
      ev.preventDefault();
      const fd = new FormData(propForm);
      let clienteId = fd.get('clienteId');
      if(!clienteId){
        const telefono = (fd.get('clienteTelefono')||'').trim();
        const nuovoCliente = saveCliente({ nome: fd.get('clienteNome')||'', telefono, email: fd.get('clienteEmail')||'', indirizzo: fd.get('clienteIndirizzo')||'', documenti: [] });
        clienteId = nuovoCliente.id;
      }
      const percentualeRaw = fd.get('percentualeProprietario');
      const propEsistente = state.modal.editing;
      const locazioneAttiva = fd.get('locazioneAttiva')==='on';
      const locazione = locazioneAttiva ? {
        attivo: true,
        dataInizio: fd.get('locazioneDataInizio')||'',
        scadenzaContratto: fd.get('locazioneScadenza')||'',
        canone: Number(fd.get('locazioneCanone'))||0,
        pagamenti: (propEsistente && propEsistente.locazione && propEsistente.locazione.pagamenti) || []
      } : (propEsistente && propEsistente.locazione ? {...propEsistente.locazione, attivo:false} : null);
      const amenitaSelezionate = fd.getAll('amenita');
      const altreRighe = (fd.get('caratteristicheAltro')||'').split('\n').map(r=>r.trim()).filter(Boolean);
      saveProperty({
        nome: fd.get('nome'),
        indirizzo: fd.get('indirizzo'),
        tipo: fd.get('tipo'),
        clienteId,
        percentualeProprietario: (percentualeRaw!==null && percentualeRaw!=='') ? Number(percentualeRaw) : 100,
        prezzoNotte: Number(fd.get('prezzoNotte'))||0,
        disponibilePrenotazioni: fd.get('disponibilePrenotazioni')==='on',
        capacitaAdulti: Number(fd.get('capacitaAdulti'))||0,
        capacitaBambini: Number(fd.get('capacitaBambini'))||0,
        animaliAmmessi: fd.get('animaliAmmessi')==='on',
        cin: fd.get('cin')||'',
        descrizioneAnnuncio: fd.get('descrizioneAnnuncio')||'',
        caratteristicheAnnuncio: [...amenitaSelezionate, ...altreRighe].join('\n'),
        locazione
      }, (propEsistente && propEsistente.id) ? propEsistente.id : null);
    });
  }

  const expenseForm = document.getElementById('expenseForm');
  if(expenseForm) expenseForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(expenseForm);
    saveExpense(state.modal.propId, {
      data: fd.get('data'), categoria: fd.get('categoria'),
      importo: Number(fd.get('importo'))||0, descrizione: fd.get('descrizione')
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  const pagaSpesaForm = document.getElementById('pagaSpesaForm');
  if(pagaSpesaForm) pagaSpesaForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(pagaSpesaForm);
    const fileInput = pagaSpesaForm.querySelector('input[type=file]');
    let ricevuta = null;
    if(fileInput && fileInput.files[0]){
      ricevuta = { url: await readAndCompressImage(fileInput.files[0]), descrizione: fd.get('descrizione')||'' };
    }
    pagaSpesa(state.modal.propId, state.modal.context.expId, { ricevuta });
  });

  const pagamentoBookingForm = document.getElementById('pagamentoBookingForm');
  if(pagamentoBookingForm) pagamentoBookingForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(pagamentoBookingForm);
    const fileInput = pagamentoBookingForm.querySelector('input[type=file]');
    let ricevuta = null;
    if(fileInput && fileInput.files[0]){
      ricevuta = { url: await readAndCompressImage(fileInput.files[0]), descrizione: fd.get('descrizione')||'' };
    }
    segnaPagamentoBooking(state.modal.propId, state.modal.context.bookingId, ricevuta);
  });

  const servizioForm = document.getElementById('servizioForm');
  if(servizioForm) servizioForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(servizioForm);
    saveServizio(state.modal.propId, {
      nome: fd.get('nome'), descrizione: fd.get('descrizione'),
      costo: Number(fd.get('costo'))||0, tipo: fd.get('tipo')
    });
  });

  const fotoImmobileForm = document.getElementById('fotoImmobileForm');
  if(fotoImmobileForm) fotoImmobileForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(fotoImmobileForm);
    const fileInput = fotoImmobileForm.querySelector('input[type=file]');
    if(!fileInput || !fileInput.files[0]) return;
    const url = await readAndCompressImage(fileInput.files[0]);
    addFotoImmobile(state.modal.propId, { url, descrizione: fd.get('descrizione'), categoria: state.modal.context });
  });

  const documentoImmobileForm = document.getElementById('documentoImmobileForm');
  if(documentoImmobileForm) documentoImmobileForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(documentoImmobileForm);
    const fileInput = documentoImmobileForm.querySelector('input[type=file]');
    if(!fileInput || !fileInput.files[0]) return;
    const url = await readFileAsDataUrl(fileInput.files[0]);
    const target=state.modal&&state.modal.context==='owner'?vpmOwnerProperty():state.properties.find(p=>p.id===state.modal.propId);
    if(!target || target.id!==state.modal.propId)return;
    addDocumentoImmobile(target.id, { url, nome: fileInput.files[0].name, descrizione: fd.get('descrizione') });
  });

  const clienteForm = document.getElementById('clienteForm');
  if(clienteForm) clienteForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(clienteForm);
    const existingDocumenti = (state.modal.editing && state.modal.editing.documenti) || [];
    const fileInput = clienteForm.querySelector('input[name=documenti]');
    let nuoviDocumenti = [];
    if(fileInput && fileInput.files.length){
      nuoviDocumenti = await Promise.all([...fileInput.files].slice(0,4).map(f=>readAndCompressImage(f)));
    }
    const editingId = state.modal.editing ? state.modal.editing.id : null;
    const cliente = saveCliente({
      nome: fd.get('nome'), telefono: fd.get('telefono'),
      email: fd.get('email')||'', indirizzo: fd.get('indirizzo')||'',
      documenti: existingDocumenti.concat(nuoviDocumenti)
    }, editingId);
    saveData(); closeModal();
    state.selectedClienteId = cliente.id;
    state.selectedId = null;
    render();
  });

  document.querySelectorAll('[data-remove-documento]').forEach(b=>{
    b.addEventListener('click', ()=>{
      removeClienteDocumento(state.modal.editing.id, Number(b.getAttribute('data-remove-documento')));
    });
  });

  const contrattoGestioneForm = document.getElementById('contrattoGestioneForm');
  if(contrattoGestioneForm) contrattoGestioneForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(contrattoGestioneForm);
    saveContrattoGestione(state.modal.propId, {
      dataInizio: fd.get('dataInizio'), scadenza: fd.get('scadenza') || null,
      servizi: fd.get('servizi'), note: fd.get('note')
    });
  });

  const preventivoForm = document.getElementById('preventivoForm');
  if(preventivoForm) preventivoForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(preventivoForm);
    addPreventivo(state.modal.propId, state.modal.context.maintId, {
      fornitore: fd.get('fornitore'), importo: Number(fd.get('importo'))||0, note: fd.get('note')
    });
  });

  const completaForm = document.getElementById('completaForm');
  if(completaForm) completaForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(completaForm);
    const fileInput = completaForm.querySelector('input[type=file]');
    let fotoDopo = [];
    if(fileInput && fileInput.files.length){
      fotoDopo = await Promise.all([...fileInput.files].slice(0,4).map(f=>readAndCompressImage(f)));
    }
    completaIntervento(state.modal.propId, state.modal.context.maintId, {
      fotoDopo,
      fatturaImporto: fd.get('fatturaImporto') ? Number(fd.get('fatturaImporto')) : null,
      fatturaNota: fd.get('fatturaNota')
    });
  });

  const paymentForm = document.getElementById('paymentForm');
  if(paymentForm) paymentForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(paymentForm);
    savePayment(state.modal.propId, {
      data: fd.get('data'), importo: Number(fd.get('importo'))||0, note: fd.get('note')
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  const versamentoForm = document.getElementById('versamentoForm');
  if(versamentoForm) versamentoForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(versamentoForm);
    saveVersamento(state.modal.propId, {
      data: fd.get('data'), importo: Number(fd.get('importo'))||0, nota: fd.get('nota')
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  const voceListinoForm = document.getElementById('voceListinoForm');
  if(voceListinoForm) voceListinoForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(voceListinoForm);
    saveVoceListino(state.modal.propId, {
      nome: fd.get('nome'), costo: Number(fd.get('costo'))||0, periodicita: fd.get('periodicita')
    });
  });

  const controlloForm = document.getElementById('controlloForm');
  if(controlloForm) controlloForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(controlloForm);
    const fileInput = controlloForm.querySelector('input[type=file]');
    let foto = (state.modal.editing && state.modal.editing.foto) || [];
    if(fileInput && fileInput.files.length){
      const descrizioneFoto = fd.get('fotoDescrizione') || '';
      const nuove = await Promise.all([...fileInput.files].slice(0,6).map(async f=>({
        id: uid(), url: await readAndCompressImage(f), descrizione: descrizioneFoto
      })));
      foto = foto.concat(nuove);
    }
    const checklist = CHECKLIST_CONTROLLO.map((voce,i)=>({voce, stato: fd.get(`voce_${i}`)||'ok'}));
    saveControllo(state.modal.propId, {
      data: fd.get('data'), note: fd.get('note'), foto, checklist
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  document.querySelectorAll('.vpm-maint-option input').forEach(r=>r.addEventListener('change',()=>{const select=document.querySelector('#maintForm select[name="tipologia"]');if(select)select.value=r.value;}));
  const maintForm = document.getElementById('maintForm');
  if(maintForm) maintForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(maintForm);
    const fileInput = maintForm.querySelector('input[type=file]');
    let foto = (state.modal.editing && state.modal.editing.foto) || [];
    if(fileInput && fileInput.files.length){
      const descrizioneFoto = fd.get('fotoDescrizione') || '';
      const nuove = await Promise.all([...fileInput.files].slice(0,4).map(async f=>({
        id: uid(), url: await readAndCompressImage(f), descrizione: descrizioneFoto
      })));
      foto = foto.concat(nuove);
    }
    const daControllo = state.modal.context && state.modal.context.daControllo;
    const propId = state.modal.propId;
    const editingId = state.modal.editing ? state.modal.editing.id : null;
    const nuovoIntervento = saveMaintenance(propId, {
      tipologia: fd.get('tipologia'),
      urgenza: fd.get('urgenza'),
      descrizione: fd.get('descrizione'),
      scadenza: fd.get('scadenza') || null,
      foto,
      richiedente: state.modal.context==='owner' ? 'Proprietario' : 'Gestore'
    }, editingId);
    if(daControllo && nuovoIntervento){
      linkInterventoAControllo(propId, daControllo.controlloId, daControllo.voce, nuovoIntervento.id);
    }
  });

  const programmaForm = document.getElementById('programmaForm');
  if(programmaForm) programmaForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(programmaForm);
    programmaIntervento(state.modal.propId, state.modal.context.maintId, fd.get('data'));
  });

  const fotoInterventoForm = document.getElementById('fotoInterventoForm');
  if(fotoInterventoForm) fotoInterventoForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(fotoInterventoForm);
    const fileInput = fotoInterventoForm.querySelector('input[type=file]');
    if(!fileInput || !fileInput.files[0]) return;
    const url = await readAndCompressImage(fileInput.files[0]);
    addFotoIntervento(state.modal.propId, state.modal.context.maintId, { url, descrizione: fd.get('descrizione') });
  });

  const settingsForm = document.getElementById('settingsForm');
  if(settingsForm) settingsForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(settingsForm);
    state.settings = { nomeAgenzia: fd.get('nomeAgenzia') || 'Property Manager', telefonoGestore: fd.get('telefonoGestore') || '', gestoreEmail: state.settings.gestoreEmail || '', impegnoServizio: fd.get('impegnoServizio') || '' };
    saveSettingsData();
    closeModal();
  });

  const bookingForm = document.getElementById('bookingForm');
  if(bookingForm) bookingForm.addEventListener('submit', ev=>ev.preventDefault());
}

render();
loadData().then(()=>{ checkAuthSession(); });
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* installazione non riuscita, l'app funziona comunque online */ });
  });
}
</script>
</body>
</html>
