const CHECKLIST_CONTROLLO = [
  'Impianto idraulico (rubinetti, scarichi, perdite)',
  'Impianto elettrico ed elettrodomestici',
  'Muri, soffitti, umidità',
  'Infissi e serramenti',
  'Pulizia e stato generale',
  'Contatori (con lettura numerica)'
];

function calcEsitoControllo(checklist){
  if(!checklist || !checklist.length) return 'regolare';
  return checklist.some(v=>v.stato==='problema') ? 'attenzione' : 'regolare';
}

function vociRisolta(v, p){
  if(v.stato==='ok') return true;
  if(v.stato==='problema' && v.interventoId){
    const interv = (p.manutenzioni||[]).find(m=>m.id===v.interventoId);
    return interv && interv.stato==='completata';
  }
  return false;
}
function isControlloConcluso(c, p){
  if(!c.checklist || !c.checklist.length) return true;
  return c.checklist.every(v=>vociRisolta(v, p));
}
function statoControlloLabel(c, p){
  if(isControlloConcluso(c, p)) return {label:'✓ Concluso', cls:'completata'};
  const problemaAperto = (c.checklist||[]).some(v=>v.stato==='problema' && !vociRisolta(v, p));
  if(problemaAperto) return {label:'Attenzione', cls:'in-corso'};
  return {label:'Da verificare', cls:'programmata'};
}

function calcProssimoControllo(p){
  const periodicita = p.periodicitaControlli || 2;
  const lista = (p.controlli||[]).slice().sort((a,b)=>new Date(b.data)-new Date(a.data));
  if(!lista.length) return { data: null, inRitardo: true };
  const ultimo = new Date(lista[0].data);
  const prossima = new Date(ultimo);
  prossima.setMonth(prossima.getMonth() + periodicita);
  return { data: prossima.toISOString().slice(0,10), inRitardo: prossima < new Date() };
}

// ---------- Centro avvisi ----------
function calcolaAlertImmobile(p){
  const prenotazioniPendenti = (p.prenotazioni||[]).filter(b=>b.stato==='richiesta').length;
  const spesePagare = (p.spese||[]).filter(e=>(e.stato||'in-attesa')==='approvata').length;
  const controlloInRitardo = calcProssimoControllo(p).inRitardo ? 1 : 0;
  const preventiviRisposti = (p.manutenzioni||[]).filter(m =>
    m.preventivo && m.stato!=='completata' &&
    ((m.preventivo.stato==='approvato' && !m.dataProgrammazione) || m.preventivo.stato==='rifiutato')
  ).length;
  const messaggiProprietario = (p.messaggi||[]).filter(m=>m.autore!=='gestore' && !m.letto).length;
  const messaggiOspiti = (p.prenotazioni||[]).reduce((s,b)=>s+(b.messaggiOspite||[]).filter(m=>m.autore!=='gestore' && !m.letto).length, 0);
  const messaggiNonLetti = messaggiProprietario + messaggiOspiti;
  const interventiDaTriage = (p.manutenzioni||[]).filter(m => m.stato==='programmata' && !m.preventivo && !m.dataProgrammazione).length;
  const totale = prenotazioniPendenti + spesePagare + controlloInRitardo + preventiviRisposti + messaggiNonLetti + interventiDaTriage;
  return { totale, prenotazioniPendenti, spesePagare, controlloInRitardo, preventiviRisposti, messaggiProprietario, messaggiOspiti, messaggiNonLetti, interventiDaTriage };
}
function calcolaAlertProprietario(p){
  const preventiviInAttesa = (p.manutenzioni||[]).filter(m=>m.preventivo && m.preventivo.stato==='in-attesa').length;
  const speseInAttesa = (p.spese||[]).filter(e=>(e.stato||'in-attesa')==='in-attesa').length;
  const controlloInRitardo = calcProssimoControllo(p).inRitardo ? 1 : 0;
  const totale = preventiviInAttesa + speseInAttesa + controlloInRitardo;
  return { totale, preventiviInAttesa, speseInAttesa, controlloInRitardo };
}
function calcolaAlertPortfolio(){
  let prenotazioniPendenti=0, spesePagare=0, controlliRitardo=0, preventiviRisposti=0, messaggiProprietario=0, messaggiOspiti=0, interventiDaTriage=0;
  immobiliVisibili().forEach(p=>{
    const a = calcolaAlertImmobile(p);
    prenotazioniPendenti += a.prenotazioniPendenti;
    spesePagare += a.spesePagare;
    controlliRitardo += a.controlloInRitardo;
    preventiviRisposti += a.preventiviRisposti;
    messaggiProprietario += a.messaggiProprietario;
    messaggiOspiti += a.messaggiOspiti;
    interventiDaTriage += a.interventiDaTriage;
  });
  const messaggiNonLetti = messaggiProprietario + messaggiOspiti;
  return {
    totale: prenotazioniPendenti+spesePagare+controlliRitardo+preventiviRisposti+messaggiNonLetti+interventiDaTriage,
    prenotazioniPendenti, spesePagare, controlliRitardo, preventiviRisposti, messaggiProprietario, messaggiOspiti, messaggiNonLetti, interventiDaTriage
  };
}
function trovaPrimoImmobileConAlert(tipo){
  if(tipo==='prenotazioni') return state.properties.find(p=>(p.prenotazioni||[]).some(b=>b.stato==='richiesta'));
  if(tipo==='spese') return state.properties.find(p=>(p.spese||[]).some(e=>(e.stato||'in-attesa')==='approvata'));
  if(tipo==='controlli') return state.properties.find(p=>calcProssimoControllo(p).inRitardo);
  if(tipo==='interventi') return state.properties.find(p=>(p.manutenzioni||[]).some(m =>
    m.preventivo && m.stato!=='completata' &&
    ((m.preventivo.stato==='approvato' && !m.dataProgrammazione) || m.preventivo.stato==='rifiutato')
  ));
  if(tipo==='interventi-nuovi') return state.properties.find(p=>(p.manutenzioni||[]).some(m => m.stato==='programmata' && !m.preventivo && !m.dataProgrammazione));
  if(tipo==='messaggi') return state.properties.find(p=>(p.messaggi||[]).some(m=>m.autore!=='gestore' && !m.letto));
  if(tipo==='messaggi-ospiti') return state.properties.find(p=>(p.prenotazioni||[]).some(b=>(b.messaggiOspite||[]).some(m=>m.autore!=='gestore' && !m.letto)));
  return null;
}

function raccogliEventiPortfolio(){
  const eventi = [];
  immobiliVisibili().forEach(p=>{
    (p.prenotazioni||[]).filter(b=>b.stato!=='rifiutata').forEach(b=>{
      if(b.checkin) eventi.push({data:b.checkin, titolo:`Check-in: ${b.nome}`, immobile:p.nome, colore:'sage', propId:p.id, tab:'prenotazioni'});
      if(b.checkout) eventi.push({data:b.checkout, titolo:`Check-out: ${b.nome}`, immobile:p.nome, colore:'brass', propId:p.id, tab:'prenotazioni'});
    });
    (p.manutenzioni||[]).filter(m=>m.stato!=='completata').forEach(m=>{
      if(m.scadenza) eventi.push({data:m.scadenza, titolo:`Scadenza intervento: ${m.descrizione}`, immobile:p.nome, colore:'terracotta', propId:p.id, tab:'interventi'});
      if(m.dataProgrammazione) eventi.push({data:m.dataProgrammazione, titolo:`Intervento programmato: ${m.descrizione}`, immobile:p.nome, colore:'brass', propId:p.id, tab:'interventi'});
    });
    const prossimoControllo = calcProssimoControllo(p);
    if(prossimoControllo.data) eventi.push({data:prossimoControllo.data, titolo:'Controllo periodico previsto', immobile:p.nome, colore: prossimoControllo.inRitardo?'terracotta':'brass', propId:p.id, tab:'controlli'});
    if(p.contrattoGestione && p.contrattoGestione.attivo && p.contrattoGestione.scadenza){
      eventi.push({data:p.contrattoGestione.scadenza, titolo:'Scadenza contratto di gestione', immobile:p.nome, colore:'terracotta', propId:p.id, tab:'anagrafica'});
    }
  });
  eventi.sort((a,b)=>new Date(a.data)-new Date(b.data));
  return eventi;
}

function renderDashboardCalendar(){
  const eventi = raccogliEventiPortfolio();
  const base = new Date();
  const viewDate = new Date(base.getFullYear(), base.getMonth()+state.dashboardCalendarOffset, 1);
  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const monthName = viewDate.toLocaleDateString('it-IT',{month:'long', year:'numeric'});
  const startWeekday = (new Date(year, month, 1).getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = new Date().toISOString().slice(0,10);

  const eventiPerGiorno = {};
  eventi.forEach(e=>{
    if(!e.data) return;
    if(!eventiPerGiorno[e.data]) eventiPerGiorno[e.data] = [];
    eventiPerGiorno[e.data].push(e);
  });

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const evs = eventiPerGiorno[key] || [];
    let cls = key===todayKey ? 'today' : '';
    if(key===state.dashboardCalendarSelectedDay) cls += ' selected';
    let dotColor = '';
    if(evs.length){
      dotColor = evs.some(e=>e.colore==='terracotta') ? 'var(--terracotta)' : evs.some(e=>e.colore==='brass') ? 'var(--brass-deep)' : 'var(--sage)';
    }
    cells += `<div class="cal-cell cal-cell-click ${cls}" style="flex-direction:column;gap:2px;" data-cal-day="${key}" title="${evs.map(e=>e.titolo+' — '+e.immobile).join('; ')}">
      <span>${day}</span>
      ${evs.length ? `<span style="width:5px;height:5px;border-radius:50%;background:${dotColor};"></span>` : ''}
    </div>`;
  }
  const weekdays = ['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  const evsGiornoSelezionato = state.dashboardCalendarSelectedDay ? (eventiPerGiorno[state.dashboardCalendarSelectedDay] || []) : null;
  const dettaglioGiorno = evsGiornoSelezionato ? `
    <div class="cal-day-detail">
      <div class="cal-day-detail-head">
        <span>${fmtDate(state.dashboardCalendarSelectedDay)}</span>
        <button type="button" class="link-btn" data-cal-day-close>chiudi</button>
      </div>
      ${evsGiornoSelezionato.length ? evsGiornoSelezionato.map(e=>`
        <div class="cal-day-detail-item" data-goto-evento="${e.propId}::${e.tab}">
          <span class="n-dot" style="background:${e.colore==='terracotta'?'var(--terracotta)':e.colore==='brass'?'var(--brass-deep)':'var(--sage)'}"></span>
          <span>${e.titolo}<div class="notif-item-sub">${e.immobile}</div></span>
        </div>
      `).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 0 0;">Nessuna attività in programma per questo giorno.</p>`}
    </div>
  ` : '';

  const prossimi = eventi.filter(e=>e.data && e.data >= todayKey).slice(0,12);
  const listaHtml = prossimi.length ? prossimi.map(e=>`
    <div class="cal-day-detail-item" style="padding:11px 2px;border-bottom:1px solid var(--line-soft); border-radius:0;" data-goto-evento="${e.propId}::${e.tab}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;flex:1;">
        <div><strong>${fmtDate(e.data)}</strong> — ${e.titolo}</div>
        <div style="color:var(--ink-soft);font-size:11.5px;font-family:'IBM Plex Mono',monospace;">${e.immobile}</div>
      </div>
    </div>
  `).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);">Nessuna scadenza o prenotazione imminente.</p>`;

  return `
    <div class="dashboard-section-card">
      <div class="calendar">
        <div class="cal-header">
          <button class="icon-btn" data-dash-cal-nav="-1">‹</button>
          <div class="cal-month">${monthName}</div>
          <button class="icon-btn" data-dash-cal-nav="1">›</button>
        </div>
        <div class="cal-grid">${weekdays}${cells}</div>
        <div class="cal-legend">
          <span><i class="dot booked"></i>Scadenza/urgente</span>
          <span><i class="dot pending"></i>Programmato</span>
        </div>
        ${dettaglioGiorno}
      </div>
      <div style="margin-top:26px; padding-top:22px; border-top:1px solid var(--line-soft);">
        <p style="font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:6px;">Prossime scadenze</p>
        ${listaHtml}
      </div>
    </div>
  `;
}

function setPercentualeProprietario(propId, valore){

function submitBooking(propId, data){
  const p = state.properties.find(x=>x.id===propId);
  if(!p.prenotazioni) p.prenotazioni = [];
  const calcolo = calcTotale(p, data.checkin, data.checkout);
  const totale = calcolo ? calcolo.totale : null;
  p.prenotazioni.push({id:uid(), ...data, totale, stato:'richiesta', createdAt:new Date().toISOString()});
  saveData();
  state.lastBooking = {propNome:p.nome, nome:data.nome, checkin:data.checkin, checkout:data.checkout, totale, linkPagamento:p.linkPagamento};
  state.guestSubmitted = true;
  state.guestPropId = null;
  render();
}

function getBookedDaysMap(prenotazioni){
  const confirmed = new Set();
  const pending = new Set();
  (prenotazioni||[]).forEach(b=>{
    if(b.stato==='rifiutata' || !b.checkin || !b.checkout) return;
    const d = new Date(b.checkin);
    const end = new Date(b.checkout);
    while(d < end){
      const key = d.toISOString().slice(0,10);
      if(b.stato==='confermata') confirmed.add(key); else pending.add(key);
      d.setDate(d.getDate()+1);
    }
  });
  return {confirmed, pending};
}

function propertyAvailableForDates(p, checkin, checkout, adulti, bambini, animali){
  if(!p.disponibilePrenotazioni) return false;
  const calcolo = calcTotale(p, checkin, checkout);
  if(!calcolo || calcolo.sottoMinimo) return false;
  const capacitaTotale = (p.capacitaAdulti||0) + (p.capacitaBambini||0);
  if(capacitaTotale>0 && ((adulti||0)+(bambini||0)) > capacitaTotale) return false;
  if((animali||0)>0 && !p.animaliAmmessi) return false;
  const {confirmed} = getBookedDaysMap([...(p.prenotazioni||[]),...vpmOwnerBlockingBookings(p)]);
  for(let d=new Date(checkin); d<new Date(checkout); d.setDate(d.getDate()+1)){
    if(confirmed.has(d.toISOString().slice(0,10))) return false;
  }
  return true;
}

    return `<div class="wizard-step ${cls}"><span class="num">${n<current?'✓':n}</span>${l}</div>`;
  }).join('')}</div>`;
}

function renderCalendar(prenotazioni, monthOffset){
  const base = new Date();
  const viewDate = new Date(base.getFullYear(), base.getMonth()+monthOffset, 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleDateString('it-IT',{month:'long', year:'numeric'});
  const startWeekday = (new Date(year, month, 1).getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const {confirmed, pending} = getBookedDaysMap(prenotazioni);
  const todayKey = new Date().toISOString().slice(0,10);

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    let cls = confirmed.has(key) ? 'booked' : pending.has(key) ? 'pending' : '';
    if(key===todayKey) cls += ' today';
    if(key===state.calendarSelectedDay) cls += ' selected';
    cells += `<div class="cal-cell cal-cell-click ${cls}" data-booking-cal-day="${key}">${day}</div>`;
  }
  const weekdays = ['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  const bookingsGiorno = state.calendarSelectedDay
    ? (prenotazioni||[]).filter(b=>b.stato!=='rifiutata' && b.checkin && b.checkout && state.calendarSelectedDay>=b.checkin && state.calendarSelectedDay<b.checkout)
    : null;
  const dettaglioGiorno = bookingsGiorno ? `
    <div class="cal-day-detail">
      <div class="cal-day-detail-head">
        <span>${fmtDate(state.calendarSelectedDay)}</span>
        <button type="button" class="link-btn" data-booking-cal-day-close>chiudi</button>
      </div>
      ${bookingsGiorno.length ? bookingsGiorno.map(b=>`
        <div class="cal-day-detail-item" style="cursor:default;">
          <span class="n-dot" style="background:${b.stato==='confermata'?'var(--terracotta)':'var(--brass-deep)'}"></span>
          <span>${b.nome} — ${fmtDate(b.checkin)} → ${fmtDate(b.checkout)}<div class="notif-item-sub">${b.stato}</div></span>
        </div>
      `).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 0 0;">Nessuna prenotazione per questo giorno.</p>`}
    </div>
  ` : '';

  return `<div class="calendar">
    <div class="cal-header">
      <button class="icon-btn" data-cal-nav="-1">‹</button>
      <div class="cal-month">${monthName}</div>
      <button class="icon-btn" data-cal-nav="1">›</button>
    </div>
    <div class="cal-grid">${weekdays}${cells}</div>
    <div class="cal-legend">
      <span><i class="dot booked"></i>Confermata</span>
      <span><i class="dot pending"></i>Richiesta in attesa</span>
    </div>
    ${dettaglioGiorno}
  </div>`;
}

function getWeekKey(date){
  const start = new Date(date.getFullYear(), 0, 1);
  const diffDays = Math.floor((date - start) / 86400000);
  const week = Math.floor(diffDays / 7) + 1;
  return `${date.getFullYear()}-W${String(week).padStart(2,'0')}`;
}
function basePriceForDate(p, date){
  const wKey = getWeekKey(date);
  const settimanali = p.prezziSettimanali || {};
  if(settimanali[wKey] !== undefined) return settimanali[wKey] / 7;
  return p.prezzoNotte || 0;
}

function calcTotale(p, checkin, checkout){
  if(!checkin || !checkout) return null;
  const start = new Date(checkin), end = new Date(checkout);
  if(!(end > start)) return null;
  const custom = p.tariffePersonalizzate || {};
  let soggiornoBase = 0, notti = 0;
  for(let d=new Date(start); d<end; d.setDate(d.getDate()+1)){
    const key = d.toISOString().slice(0,10);
    const prezzo = custom[key] !== undefined ? custom[key] : basePriceForDate(p, d);
    soggiornoBase += prezzo;
    notti++;
  }
  const servizi = (p.servizi||[]).map(s=>({
    nome: s.nome,
    importo: s.tipo==='notte' ? Number(s.costo||0)*notti : Number(s.costo||0)
  }));
  const totaleServizi = servizi.reduce((sum,s)=>sum+s.importo,0);
  const totale = soggiornoBase + totaleServizi;
  const notteMinima = p.notteMinima || 1;
  return {totale, notti, soggiornoBase, servizi, totaleServizi, sottoMinimo: notti < notteMinima, notteMinima};
}

    cells += `<div class="cal-cell cal-cell-price ${hasCustom?'custom':''}" data-price-day="${key}">
      <span class="cal-day-num">${day}</span>

}

function renderPrezziSettimanali(p, year){
  const prezzi = p.prezziSettimanali || {};
  let week = 1, currentMonth = -1, html = '';
  while(true){
    const weekStart = new Date(year, 0, 1 + (week-1)*7);
    if(weekStart.getFullYear() > year || week > 53) break;
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
    const key = `${year}-W${String(week).padStart(2,'0')}`;
    const month = weekStart.getMonth();
    if(month !== currentMonth){
      currentMonth = month;
      html += `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-deep);margin:14px 0 6px 0;">${weekStart.toLocaleDateString('it-IT',{month:'long'})}</div>`;
    }
    const valore = prezzi[key] !== undefined ? prezzi[key] : '';
    html += `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;">
      <div style="width:70px;font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;">Sett. ${week}</div>
      <div style="width:110px;font-size:11.5px;color:var(--ink-soft);">${weekStart.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})} – ${weekEnd.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}</div>
      <input type="number" data-week-key="${key}" value="${valore}" placeholder="base: €${Math.round((p.prezzoNotte||0)*7)}" style="max-width:150px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;font-size:13px;">
      <span style="font-size:11px;color:var(--ink-soft);">€ / settimana</span>
    </div>`;
    week++;
  }
  return `<div style="max-height:360px;overflow-y:auto;border:1px solid var(--line-soft);border-radius:6px;padding:10px 16px;margin-bottom:16px;">${html}</div>`;
}

    ${azioniGestore}
    ${storicoBlock}
  </div>`;
}

function renderSpese(p, role){
  const tutte = [...(p.spese||[])].sort((a,b)=>new Date(b.data)-new Date(a.data));
  if(!tutte.length) return `<div class="empty-inline">Nessuna spesa registrata.</div>`;

  const attive = tutte.filter(e=>(e.stato||'in-attesa')!=='pagata');
  const pagate = tutte.filter(e=>e.stato==='pagata');

  let html = attive.length
    ? attive.map(e=>renderSpesaCard(e, role)).join('')
    : `<div class="empty-inline">Nessuna spesa da gestire al momento.</div>`;

  if(pagate.length){
    html += `
      <button class="archivio-toggle" data-toggle-spese-pagate>
        <span class="chev">${state.mostraSpesePagate ? '▾' : '▸'}</span>
        <span>Spese pagate</span>
        <span class="count">${pagate.length}</span>
      </button>
      ${state.mostraSpesePagate ? `<div class="archivio-body">${pagate.map(e=>renderSpesaCard(e, role)).join('')}</div>` : ''}
    `;
  }

  return html;
}

function renderMessages(p, viewer){
  const list = [...(p.messaggi||[])].sort((a,b)=>new Date(a.data)-new Date(b.data));
  const bubbles = list.map(m=>`
    <div class="msg-bubble ${m.autore===viewer?'own':''}">
      <div>${m.testo}</div>
      <div class="msg-meta">${m.autore==='gestore'?'Gestore':'Proprietario'} · ${fmtDate(m.data)}${tickMarkHtml(m, viewer)}</div>
    </div>
  `).join('') || '<p style="font-size:12.5px;color:var(--ink-soft);margin:0;">Nessun messaggio ancora. Scrivi il primo qui sotto.</p>';
  return `
    <div class="msg-thread" data-msg-thread>${bubbles}</div>
    <form class="msg-form" data-msg-form="${p.id}" data-autore="${viewer}">
      <input type="text" name="testo" placeholder="Scrivi un messaggio..." required autocomplete="off">
      <button type="submit" class="send-btn" aria-label="Invia messaggio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4 14 20 11 13 4 12Z"/></svg>
      </button>
    </form>
  `;
}

// ---------- Rendering condivise ----------
const URGENZA_COLORI = {Bassa:'completata', Media:'programmata', Alta:'in-corso'};

function renderFotoInterventoCards(foto, editable, propId, mId){
  const list = (foto||[]).filter(f=>typeof f==='object');
  if(!list.length) return '';
  return `<div style="margin:8px 0;">${list.map(f=>`
    <div class="foto-card" style="margin-bottom:6px;">
      <img src="${f.url}">
      <div class="foto-card-body">
        <div class="foto-card-desc">${f.descrizione || '<span style="color:var(--ink-soft);font-style:italic;">Nessuna descrizione</span>'}</div>
        ${editable ? `<button class="link-btn" data-del-foto-intervento="${mId}::${f.id}" style="align-self:flex-start;">rimuovi</button>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

function renderInterventoCard(m, p, role){
  const isGestore = role==='gestore';
  const fotoStrip = renderFotoInterventoCards(m.foto, isGestore, p.id, m.id);
  const fotoDopoStrip = (m.fotoDopo && m.fotoDopo.length) ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:8px;margin-bottom:4px;">Foto dopo l'intervento:</div>${renderPhotoGallery(m.fotoDopo)}` : '';
  const richiedente = m.richiedente ? `Segnalato da: ${m.richiedente}` : '';
  const urgenzaBadge = m.urgenza ? `<span class="status-pill ${URGENZA_COLORI[m.urgenza]||'programmata'}">${m.urgenza}</span>` : '';
  const tipologiaTxt = m.tipologia ? m.tipologia : '';

  let preventivoBlock = '';
  if(m.preventivo){
    const pv = m.preventivo;
    const statoLabel = pv.stato==='in-attesa' ? 'in attesa di approvazione' : pv.stato;
    preventivoBlock = `<div class="preventivo-box">
      ${stampMarkHtml('preventivo:'+m.id)}
      Preventivo — <strong>${pv.fornitore}</strong>: <span class="importo">${fmtCurrency(pv.importo)}</span>
      ${pv.note ? `<div style="font-size:12px;margin-top:4px;">${pv.note}</div>` : ''}
      <div style="margin-top:8px;">
        ${pv.stato==='in-attesa'
          ? (role==='proprietario'
              ? `<button class="btn-approva" data-approva-preventivo="${m.id}">APPROVA</button><button class="btn-rifiuta" data-rifiuta-preventivo="${m.id}">RIFIUTA</button>`
              : `<span class="status-pill programmata">${statoLabel}</span>`)
          : `<span class="status-pill ${pv.stato==='approvato'?'completata':'in-corso'}">${statoLabel}</span>`}
      </div>
    </div>`;
  }

  let fatturaBlock = '';
  if(m.fattura){
    fatturaBlock = `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:8px;">Fattura: <strong style="color:var(--ink);">${fmtCurrency(m.fattura.importo)}</strong>${m.fattura.nota?(' — '+m.fattura.nota):''}</div>`;
  }

  const programmazioneBlock = m.dataProgrammazione
    ? `<div style="font-size:12.5px;color:var(--brass-deep);margin-top:6px;"><i class="ti ti-calendar"></i> Programmato per il ${fmtDate(m.dataProgrammazione)}</div>`
    : '';

  const storico = (m.storico||[]).slice().reverse();
  const storicoBlock = storico.length ? `<div class="storico-list">${storico.map(s=>`<div class="storico-item"><span class="storico-data">${fmtDate(s.data)}</span>${s.testo}</div>`).join('')}</div>` : '';

  const azioniGestore = isGestore ? `
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
      <span class="status-pill ${m.stato} clickable" data-cycle-status="${m.id}" title="Clicca per cambiare stato">${m.stato.replace('-',' ')}<i class="ti ti-chevron-down"></i></span>
      <button class="icon-btn" data-add-foto-intervento="${m.id}">+ Foto</button>
      ${!m.preventivo ? `<button class="icon-btn" data-add-preventivo="${m.id}">+ Aggiungi preventivo</button>` : ''}
      ${m.stato!=='completata' ? `<button class="icon-btn" data-programma-intervento="${m.id}"><i class="ti ti-calendar"></i> Programma</button>` : ''}
      ${m.stato!=='completata' ? `<button class="icon-btn" data-complete-intervento="${m.id}">Segna completato</button>` : ''}
      <button class="icon-btn danger" data-del-maint="${m.id}" title="Rimuovi intervento" style="margin-left:auto;"><i class="ti ti-trash"></i></button>
    </div>` : '';

  return `<div class="intervento-card">
    <div class="intervento-titolo">${m.descrizione}</div>
    <div class="intervento-meta">
      ${tipologiaTxt} ${urgenzaBadge} ${!isGestore ? `<span class="status-pill ${m.stato}">${m.stato.replace('-',' ')}</span>` : ''}
      <div style="margin-top:4px;">${richiedente}${m.scadenza ? (richiedente?' · ':'')+'Scadenza: '+fmtDate(m.scadenza) : ''}</div>
    </div>
    ${programmazioneBlock}
    ${fotoStrip}
    ${preventivoBlock}
    ${fotoDopoStrip}
    ${fatturaBlock}
    ${azioniGestore}
    ${storicoBlock}
  </div>`;
}

function renderInterventions(p, role){
  const tutti = (p.manutenzioni||[]).slice().sort((a,b)=>new Date(b.storico&&b.storico[0]?b.storico[0].data:0) - new Date(a.storico&&a.storico[0]?a.storico[0].data:0));
  if(!tutti.length) return `<div class="empty-inline">Nessun intervento registrato ancora.</div>`;

  const attivi = tutti.filter(m=>m.stato!=='completata');
  const completati = tutti.filter(m=>m.stato==='completata');

  let html = attivi.length
    ? attivi.map(m=>renderInterventoCard(m, p, role)).join('')
    : `<div class="empty-inline">Nessun intervento in corso al momento.</div>`;

  if(completati.length){
    html += `
      <button class="archivio-toggle" data-toggle-completati>
        <span class="chev">${state.mostraInterventiCompletati ? '▾' : '▸'}</span>
        <span>Interventi completati</span>
        <span class="count">${completati.length}</span>
      </button>
      ${state.mostraInterventiCompletati ? `<div class="archivio-body">${completati.map(m=>renderInterventoCard(m, p, role)).join('')}</div>` : ''}
    `;
  }

  return html;
}

          Dal ${fmtDate(c.dataInizio)}${c.scadenza ? ` al ${fmtDate(c.scadenza)}` : ' (senza scadenza)'}

function renderLocazione(p){

          ${b.note ? `<div style="font-size:12px;color:var(--ink-soft);">Nota: ${b.note}</div>` : ''}
          ${(b.dichiaraPagato && !b.pagamentoRicevuto) ? `<div style="font-size:11.5px;color:var(--brass-deep);font-weight:600;margin-top:4px;"><i class="ti ti-credit-card"></i> il cliente dichiara di aver pagato — verifica e conferma</div>` : ''}
          ${b.documento ? `<img class="doc-preview" src="${b.documento}">` : ''}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
          <span class="booking-status ${b.stato}">${b.stato}</span>
          ${b.pagamentoRicevuto ? `<span style="font-size:11px;color:var(--sage);font-weight:600;">✓ pagamento ricevuto</span>` : ''}
          ${waButton(b.telefono, `Ciao ${b.nome}, la contatto riguardo alla richiesta di prenotazione per ${p.nome}.`, 'WhatsApp')}

      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        ${b.stato==='richiesta' ? `
          <button class="icon-btn" data-confirm-booking="${b.id}">Conferma</button>

        ${renderBookingChat(p, b, 'gestore')}

  `).join('');
  return rows;
}


// Accessi rapidi locali per singolo gestore: soltanto ID e solo record ancora autorizzati.
const vpmQuickExpanded={clients:false,properties:false};
function vpmRecentKey(kind){return 'viverepm-recent-'+kind+'-'+String(state.gestoreAuthUser||'gestore').toLowerCase();}
function vpmRecentIds(kind){
  try{const data=JSON.parse(localStorage.getItem(vpmRecentKey(kind))||'[]');return Array.isArray(data)?data.filter(x=>typeof x==='string').slice(0,3):[];}catch(_){return [];}
}
function vpmRememberRecent(kind,id){
  if(!id||!state.gestoreUnlocked)return;
  try{localStorage.setItem(vpmRecentKey(kind),JSON.stringify([id,...vpmRecentIds(kind).filter(x=>x!==id)].slice(0,3)));}catch(_){}
}
function vpmRecentVisible(kind,available){
  const ids=vpmRecentIds(kind);
  return ids.map(id=>available.find(item=>item.id===id)).filter(Boolean);
}

let vpmFinanceFilter={property:'all',period:'all',type:'all'};
function vpmFinanceMovements(){
  const today=new Date(),start=period=>{const d=new Date(today.getFullYear(),today.getMonth(),1);if(period==='previous')d.setMonth(d.getMonth()-1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0')].join('-');};
  return immobiliVisibili().flatMap(p=>(p.spese||[]).map(m=>({p,m}))).filter(({p,m})=>{
    if(vpmFinanceFilter.property!=='all'&&p.id!==vpmFinanceFilter.property)return false;
    if(vpmFinanceFilter.period==='all')return true;
    const month=String(m.data||'').slice(0,7);
    return month===start(vpmFinanceFilter.period);
  });
}
function vpmFinanceExport(){
  const rows=vpmFinanceMovements().filter(({m})=>vpmFinanceFilter.type==='all'||(vpmFinanceFilter.type==='income'?m.tipo==='entrata':m.tipo!=='entrata'));
  const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const data=[['Data','Immobile','Descrizione','Tipo','Stato','Importo EUR'],...rows.map(({p,m})=>[m.data||'',p.nome||'',m.descrizione||m.voce||'',m.tipo==='entrata'?'Entrata':'Uscita',m.stato||'',Number(m.importo)||0])];
  const csv='\uFEFF'+data.map(row=>row.map(quote).join(';')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const link=document.createElement('a');link.href=url;link.download='viverepm-movimenti-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function renderClienteCRM(c){

  });
  eventi.sort((a,b)=>new Date(b.data)-new Date(a.data));
  const eventiHtml = eventi.length ? eventi.slice(0,40).map(e=>`

    </div>
  `).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);">Nessuna attività registrata ancora.</p>`;

  const safe=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

let vpmBookingMonthOffset=0;
let vpmBookingSelectedDay='';
function vpmBookingCalendar(rows){
  const now=new Date(),month=new Date(now.getFullYear(),now.getMonth()+vpmBookingMonthOffset,1);
  const year=month.getFullYear(),m=month.getMonth(),days=new Date(year,m+1,0).getDate();
  const offset=(month.getDay()+6)%7;
  const localKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const today=localKey(now),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'" :'&#39;'}[c]));
  const dayRows=day=>rows.filter(({b})=>b.stato!=='rifiutata'&&b.checkin&&b.checkout&&b.checkin<=day&&b.checkout>=day);
  const cells=Array.from({length:offset},()=>'<div class="vpm-calendar-blank"></div>');
  for(let d=1;d<=days;d++){
    const key=localKey(new Date(year,m,d)),active=dayRows(key),arrival=active.filter(({b})=>b.checkin===key).length,departure=active.filter(({b})=>b.checkout===key).length;
    const confirmed=active.filter(({b})=>b.stato==='confermata'||b.stato==='confermato').length,pending=active.filter(({b})=>b.stato==='richiesta').length;
    cells.push(`<button type="button" class="vpm-calendar-day ${key===today?'today':''} ${key===vpmBookingSelectedDay?'selected':''}" data-booking-day="${key}" aria-label="${d} ${month.toLocaleDateString('it-IT',{month:'long'})}: ${confirmed} confermate, ${pending} richieste"><b>${d}</b><span class="vpm-calendar-dots">${confirmed?'<i class="confirmed"></i>':''}${pending?'<i class="pending"></i>':''}</span>${arrival||departure?`<small>${arrival?'↓'+arrival:''} ${departure?'↑'+departure:''}</small>`:''}</button>`);
  }
  const selected=vpmBookingSelectedDay&&vpmBookingSelectedDay.startsWith(year+'-'+String(m+1).padStart(2,'0'))?vpmBookingSelectedDay:'';
  const agenda=selected?dayRows(selected):[];
  const agendaHtml=selected?`<div class="vpm-calendar-agenda"><h3>${new Date(selected+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} <small>${agenda.length} prenotazioni</small></h3>${agenda.map(({p,b})=>`<button data-vai-a-immobile="${safe(p.id)}"><strong>${safe(p.nome)}</strong><span>${safe(b.nome||'Ospite')} · ${b.checkin===selected?'Arrivo · ':''}${b.checkout===selected?'Partenza · ':''}${safe(b.stato)}</span></button>`).join('')||'<p>Nessuna prenotazione per questa data.</p>'}</div>`:'' ;
  return `<section class="vpm-calendar-panel"><div class="vpm-calendar-head"><div><span>PIANIFICAZIONE</span><h2>Calendario occupazioni</h2><p>Seleziona un giorno per vedere le prenotazioni. La partenza è indicata separatamente.</p></div><div class="vpm-calendar-controls"><button type="button" data-booking-month="-1" aria-label="Mese precedente"><i class="ti ti-chevron-left"></i></button><strong>${month.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</strong><button type="button" data-booking-month="1" aria-label="Mese successivo"><i class="ti ti-chevron-right"></i></button><button type="button" data-booking-today>Oggi</button></div></div><div class="vpm-calendar-weekdays">${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="vpm-calendar-grid">${cells.join('')}</div><div class="vpm-calendar-legend"><span><i class="confirmed"></i> Confermata</span><span><i class="pending"></i> Da confermare</span><span>↓ Arrivi · ↑ Partenze</span></div>${agendaHtml}</section>`;
}

function renderControlloCard(c, p, editable){
  const stato = statoControlloLabel(c, p);
  const checklistHtml = (c.checklist && c.checklist.length) ? `
    <div style="margin:10px 0;">
      ${c.checklist.map(v=>{
        const colore = v.stato==='problema' ? 'var(--terracotta)' : v.stato==='verificare' ? 'var(--brass-deep)' : 'var(--sage)';
        const simbolo = v.stato==='problema' ? '✕' : v.stato==='verificare' ? '△' : '✓';
        let azioneIntervento = '';
        if(v.stato==='problema'){
          const interventoCollegato = v.interventoId ? (p.manutenzioni||[]).find(m=>m.id===v.interventoId) : null;
          if(interventoCollegato){
            azioneIntervento = interventoCollegato.stato==='completata'
              ? `<span style="color:var(--sage);font-size:11.5px;margin-left:8px;"><span class="seal" style="width:16px;height:16px;font-size:9px;">✓</span>intervento risolto</span>`
              : `<span class="status-pill ${interventoCollegato.stato}" style="margin-left:8px;">intervento ${interventoCollegato.stato.replace('-',' ')}</span>`;
          } else if(editable){
            azioneIntervento = `<button class="link-btn" data-crea-intervento-da-controllo="${c.id}::${encodeURIComponent(v.voce)}" style="margin-left:8px;">apri intervento</button>`;
          }
        }
        return `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;flex-wrap:wrap;">
          <span style="color:${colore};font-weight:700;width:14px;">${simbolo}</span>
          <span>${v.voce}</span>
          ${azioneIntervento}
        </div>`;
      }).join('')}
    </div>
  ` : '';
  return `
    <div class="checkin-row">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="checkin-date">${fmtDate(c.data)}</div>
            <span class="status-pill ${stato.cls}">${stato.label}</span>
          </div>
          ${checklistHtml}
          ${c.note ? `<div style="font-size:13px;margin-top:4px;">${c.note}</div>` : ''}
          ${renderPhotoGallery(c.foto)}
        </div>
        ${editable ? `<button class="link-btn" data-del-controllo="${c.id}">rimuovi</button>` : ''}
      </div>
    </div>
  `;
}

function renderControlli(p, editable){
  const list = [...(p.controlli||[])].sort((a,b)=>new Date(b.data)-new Date(a.data));
  if(!list.length){
    return `<div class="empty-inline">Nessun controllo registrato ancora.</div>`;
  }
  const inCorso = list.filter(c=>!isControlloConcluso(c, p));
  const conclusi = list.filter(c=>isControlloConcluso(c, p));

  let html = inCorso.length
    ? inCorso.map(c=>renderControlloCard(c, p, editable)).join('')
    : `<div class="empty-inline">Nessun controllo in attesa di risoluzione — tutto verde.</div>`;

  if(conclusi.length){
    html += `
      <button class="archivio-toggle" data-toggle-controlli-conclusi>
        <span class="chev">${state.mostraControlliConclusi ? '▾' : '▸'}</span>
        <span>Controlli conclusi</span>
        <span class="count">${conclusi.length}</span>
      </button>
      ${state.mostraControlliConclusi ? `<div class="archivio-body">${conclusi.map(c=>renderControlloCard(c, p, editable)).join('')}</div>` : ''}
    `;
  }

  return html;
}

// ---------- Vista Area Proprietari ----------

function vpmOwnerClient(){return state.ownerAuth?getClienteByEmail(state.ownerAuth.email):null;}
function vpmOwnerProperty(){const c=vpmOwnerClient();return c?state.properties.find(p=>p.id===state.ownerPropId&&p.clienteId===c.id):null;}
function vpmOwnerEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function vpmOwnerBlocks(p){return Array.isArray(p.blocchiProprietario)?p.blocchiProprietario:[];}
function vpmOwnerBlockingBookings(p){return vpmOwnerBlocks(p).map(b=>({checkin:b.dal,checkout:b.al,stato:'confermata',nome:'Uso personale',id:b.id}));}
function vpmOwnerDocList(p){const docs=p.documenti||[];return docs.length?docs.map(d=>'<div class="vpm-owner-doc"><i class="ti ti-file-description"></i><div><strong>'+vpmOwnerEscape(d.nome||'Documento')+'</strong><small>'+vpmOwnerEscape(d.descrizione||fmtDate(d.data))+'</small></div><a class="icon-btn" href="'+d.url+'" target="_blank" rel="noopener" download="'+vpmOwnerEscape(d.nome||'documento')+'">Apri <i class="ti ti-external-link"></i></a></div>').join(''):'<div class="vpm-owner-empty">Non ci sono ancora documenti per questo immobile.</div>';}
function vpmOwnerBlockList(p){const blocks=vpmOwnerBlocks(p).slice().sort((a,b)=>String(a.dal).localeCompare(String(b.dal)));return blocks.length?blocks.map(b=>'<div class="vpm-owner-block"><i class="ti ti-calendar-off"></i><div><strong>'+fmtDate(b.dal)+' — '+fmtDate(b.al)+'</strong><small>'+vpmOwnerEscape(b.nota||'Uso personale')+'</small></div><button class="icon-btn danger" data-owner-remove-block="'+vpmOwnerEscape(b.id)+'">Rimuovi</button></div>').join(''):'<div class="vpm-owner-empty">Nessuna data bloccata per uso personale.</div>';}
function vpmOwnerNavCard(tab,icon,title,description,color,count){return '<button type="button" class="vpm-owner-tile '+color+'" data-owner-tab="'+tab+'"><span class="vpm-owner-tile-icon"><i class="ti '+icon+'"></i></span><strong>'+title+'</strong><small>'+description+'</small>'+(count?'<span class="vpm-owner-tile-count">'+count+'</span>':'')+'<i class="ti ti-arrow-up-right vpm-owner-tile-arrow"></i></button>';}

function renderProprietariView(){

    ownerTabContent = '<div class="vpm-owner-section-intro purple"><i class="ti ti-user-circle"></i><div><strong>I tuoi dati</strong><small>Aggiorna recapiti e indirizzo di residenza.</small></div></div><form id="vpmOwnerProfileForm" class="vpm-owner-form"><div class="field"><label>Nome e cognome</label><input name="nome" required maxlength="150" value="'+vpmOwnerEscape(clienteLoggato.nome)+'"></div><div class="field-row"><div class="field"><label>Telefono</label><input name="telefono" type="tel" maxlength="50" value="'+vpmOwnerEscape(clienteLoggato.telefono)+'"></div><div class="field"><label>Email di accesso</label><input type="email" value="'+vpmOwnerEscape(clienteLoggato.email)+'" disabled></div></div><div class="field"><label>Indirizzo di residenza</label><input name="indirizzo" maxlength="250" value="'+vpmOwnerEscape(clienteLoggato.indirizzo)+'"></div><p class="vpm-owner-hint">Per cambiare l’email di accesso contatta il gestore.</p><button type="submit" class="btn-primary"><i class="ti ti-check"></i> Salva i miei dati</button></form>';
  }

  return `<div class="portal-shell vpm-owner-shell" style="max-width:1060px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      ${mieiImmobili.length>1 ? `<button class="link-btn" data-owner-back>← I miei immobili</button>` : `<span></span>`}
      <button class="link-btn" data-owner-logout>Esci</button>
    </div>
    <h1 class="page-title">${propertyTypeIcon(p.tipo)}${p.nome}</h1>
    <p class="page-sub">${p.indirizzo||'—'} · ${p.tipo}</p>

    <div class="dossier-tabs">${ownerTabsHtml}</div>
    ${ownerTabContent}
  </div>`;
}

// ---------- Vista Prenota un soggiorno ----------
function renderGestisciPrenotazione(){
  if(!state.guestManagePhone){
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-manage-exit style="margin-bottom:16px;">← Torna alla prenotazione</button>
      <h1 class="page-title">Gestisci la tua prenotazione</h1>
      <p class="page-sub">Inserisci il numero di telefono che hai usato per prenotare.</p>
      <form id="guestLookupForm" style="max-width:320px;">
        <div class="field"><label>Telefono</label><input name="telefono" required placeholder="+39..."></div>
        <button type="submit" class="btn-primary" style="width:100%;">Cerca</button>
      </form>
    </div>`;
  }

  const risultati = [];
  state.properties.forEach(p=>{
    (p.prenotazioni||[]).forEach(b=>{
      if(b.telefono === state.guestManagePhone) risultati.push({p, b});
    });
  });

  if(!risultati.length){
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-manage-reset style="margin-bottom:16px;">← Cerca un altro numero</button>
      <h1 class="page-title">Nessuna prenotazione trovata</h1>
      <p class="page-sub">Controlla di aver inserito lo stesso numero usato in fase di prenotazione.</p>
    </div>`;
  }

  let selezionata = state.guestManageSelected;
  if(!selezionata && risultati.length===1){
    selezionata = {propId: risultati[0].p.id, bookingId: risultati[0].b.id};
    state.guestManageSelected = selezionata;
  }

  if(!selezionata){
    const cards = risultati.map(r=>`
      <div class="portal-pick-card" data-guest-manage-pick="${r.p.id}::${r.b.id}">
        <div><div style="font-family:'Fraunces',serif;font-weight:600;">${r.p.nome}</div><div style="font-size:12px;color:var(--ink-soft);">${fmtDate(r.b.checkin)} → ${fmtDate(r.b.checkout)} · ${r.b.stato}</div></div>
        <span style="color:var(--ink-soft);">→</span>
      </div>`).join('');
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-manage-reset style="margin-bottom:16px;">← Cerca un altro numero</button>
      <h1 class="page-title">Le tue prenotazioni</h1>
      <div class="portal-picker">${cards}</div>
    </div>`;
  }

  const p = state.properties.find(x=>x.id===selezionata.propId);
  const b = p && (p.prenotazioni||[]).find(x=>x.id===selezionata.bookingId);
  if(!p || !b){ state.guestManageSelected = null; return renderGestisciPrenotazione(); }

  const statoLabel = {richiesta:'In attesa di conferma', confermata:'Confermata', rifiutata:'Rifiutata'}[b.stato] || b.stato;
  const statoColore = b.stato==='confermata' ? 'sage' : b.stato==='rifiutata' ? 'terracotta' : '';

  return `<div class="portal-shell" style="max-width:760px;">
    <button class="link-btn" ${risultati.length>1 ? 'data-guest-manage-deselect' : 'data-guest-manage-reset'} style="margin-bottom:16px;">← ${risultati.length>1 ? 'Le tue prenotazioni' : 'Cerca un altro numero'}</button>
    <h1 class="page-title">${propertyTypeIcon(p.tipo)}${p.nome}</h1>
    <p class="page-sub">${fmtDate(b.checkin)} → ${fmtDate(b.checkout)}</p>

    <div class="chart-card">
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <div class="stat-card" style="flex:1;min-width:140px;"><div class="stat-label">Stato</div><div class="stat-value ${statoColore}" style="font-size:17px;">${statoLabel}</div></div>
        ${b.totale ? `<div class="stat-card" style="flex:1;min-width:140px;"><div class="stat-label">Totale</div><div class="stat-value" style="background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">${fmtCurrency(b.totale)}</div></div>` : ''}
      </div>
      ${b.pagamentoRicevuto
        ? `<p style="color:var(--sage);font-size:13.5px;font-weight:500;margin:16px 0 0 0;"><span class="seal">✓</span>Pagamento ricevuto</p>`
        : (p.linkPagamento && b.totale && b.stato==='confermata'
            ? `<a class="btn-primary" href="${p.linkPagamento}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;margin-top:16px;">Paga ora</a>`
            : '')}
    </div>

    <p class="section-label" style="margin-top:24px;">Messaggi con l'agenzia</p>
    ${renderBookingChat(p, b, 'ospite')}
  </div>`;
}

function renderOspitiView(){
  if(state.guestManageMode) return renderGestisciPrenotazione();

  if(state.guestSubmitted && state.lastBooking){
    const b = state.lastBooking;
    return `<div class="portal-shell" style="text-align:center;">
      <div class="guest-confirm-mark"><i class="ti ti-check"></i></div>
      <h1 class="page-title">Richiesta inviata</h1>
      <p class="page-sub">Ti contatteremo a breve per confermare la prenotazione presso ${b.propNome}.</p>
      ${b.totale ? `<p style="font-size:15px;margin-bottom:18px;">Totale soggiorno: <strong>${fmtCurrency(b.totale)}</strong></p>` : ''}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;">
        ${b.linkPagamento ? `<a class="btn-primary" href="${b.linkPagamento}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;">Paga ora</a>` : ''}
        ${waButton(state.settings.telefonoGestore, `Ciao! Ho inviato una richiesta di prenotazione per ${b.propNome} dal ${b.checkin} al ${b.checkout}. Sono ${b.nome}.`, 'Scrivici su WhatsApp per accelerare')}
      </div>
      <p style="font-size:12.5px;color:var(--ink-soft);">Potrai seguire lo stato e la ricevuta di pagamento da "Gestisci la tua prenotazione", inserendo il numero di telefono usato ora.</p>
      <br>
      <button class="btn-secondary" data-guest-restart>Fai un'altra richiesta</button>
    </div>`;
  }

  const step = state.guestWizardStep || 1;

  // ---- Step 1: scelta periodo ----
  if(step===1){
    return `<div class="portal-shell" style="max-width:760px;">
      <div class="guest-hero">
        <div class="guest-hero-brand">${state.settings.nomeAgenzia || 'Property Manager'}</div>
        <h1>Trova il tuo prossimo soggiorno</h1>
        <p>Scegli le date, controlla la disponibilità in tempo reale e prenota in pochi minuti.</p>
      </div>
      <button class="link-btn" data-guest-goto-manage style="margin-bottom:20px;display:block;">Hai già prenotato? Gestisci la tua prenotazione →</button>
      ${renderWizardSteps(1)}
      <form id="guestDatesForm" style="max-width:420px;">
        <div class="field-row">
          <div class="field"><label>Check-in</label><input type="date" name="checkin" required value="${state.guestDates.checkin}"></div>
          <div class="field"><label>Check-out</label><input type="date" name="checkout" required value="${state.guestDates.checkout}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Adulti</label><input type="number" name="adulti" min="1" required value="${state.guestDates.adulti||1}"></div>
          <div class="field"><label>Bambini</label><input type="number" name="bambini" min="0" value="${state.guestDates.bambini||0}"></div>
        </div>
        <div class="field"><label>Animali domestici al seguito</label><input type="number" name="animali" min="0" value="${state.guestDates.animali||0}"></div>
        <button type="submit" class="btn-primary" style="width:100%;margin-top:8px;">Cerca immobili disponibili</button>
      </form>
    </div>`;
  }

  // ---- Step 2: immobili disponibili ----
  if(step===2){
    const gd = state.guestDates;
    const bookable = state.properties.filter(p=>propertyAvailableForDates(p, gd.checkin, gd.checkout, gd.adulti, gd.bambini, gd.animali));
    const cards = bookable.map(p=>{
      const cop = getCoverPhotoPubblicaUrl(p);
      const calcolo = calcTotale(p, gd.checkin, gd.checkout);
      const caratteristiche = [
        (p.capacitaAdulti||p.capacitaBambini) ? `<i class="ti ti-user"></i> fino a ${p.capacitaAdulti||0} adult${p.capacitaAdulti===1?'o':'i'}${p.capacitaBambini?` + ${p.capacitaBambini} bambin${p.capacitaBambini===1?'o':'i'}`:''}` : null,
        p.animaliAmmessi ? '<i class="ti ti-dog"></i> animali ammessi' : null
      ].filter(Boolean).join(' · ');
      return `<div class="guest-prop-card" data-guest-pick="${p.id}">
        ${cop ? `<img class="guest-prop-card-img" src="${cop}">` : `<div class="guest-prop-card-img placeholder">${propertyTypeIcon(p.tipo)}</div>`}
        <div class="guest-prop-card-body">
          <div class="guest-prop-card-name">${p.nome}</div>
          <div class="guest-prop-card-addr">${p.indirizzo||'—'} · ${p.tipo}</div>
          ${caratteristiche ? `<div class="guest-prop-card-feat">${caratteristiche}</div>` : ''}
          <div class="guest-prop-card-foot">
            <span class="guest-prop-card-price">${fmtCurrency(calcolo.totale)}</span>
            <span class="guest-prop-card-nights">${calcolo.notti} nott${calcolo.notti===1?'e':'i'}</span>
          </div>
        </div>
      </div>`;
    }).join('') || '<p style="color:var(--ink-soft);">Nessun immobile disponibile per queste date e per il numero di ospiti/animali indicato. Prova a cambiare i criteri.</p>';

    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-wizard-back="1" style="margin-bottom:16px;">← Cambia criteri</button>
      ${renderWizardSteps(2)}
      <h1 class="page-title">Immobili disponibili</h1>
      <p class="page-sub">${fmtDate(gd.checkin)} → ${fmtDate(gd.checkout)} · ${gd.adulti} adult${gd.adulti===1?'o':'i'}${gd.bambini?`, ${gd.bambini} bambin${gd.bambini===1?'o':'i'}`:''}${gd.animali?`, ${gd.animali} animal${gd.animali===1?'e':'i'}`:''}</p>
      <div class="guest-prop-grid">${cards}</div>
    </div>`;
  }

  const p = state.properties.find(x=>x.id===state.guestPropId);
  if(!p){ state.guestWizardStep = 2; return renderOspitiView(); }
  const calcolo = calcTotale(p, state.guestDates.checkin, state.guestDates.checkout);

  // ---- Step 3: dettagli immobile e importo ----
  if(step===3){
    const righeServizi = calcolo.servizi.map(s=>`<tr><td>${s.nome}</td><td class="cell-num">${fmtCurrency(s.importo)}</td></tr>`).join('');
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-wizard-back="2" style="margin-bottom:16px;">← Altri immobili</button>
      ${renderWizardSteps(3)}
      <h1 class="page-title">${propertyTypeIcon(p.tipo)}${p.nome}</h1>
      <p class="page-sub">${p.indirizzo||'—'} · ${p.tipo}</p>
      ${p.cin ? `<p style="font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);letter-spacing:.03em;margin:-4px 0 4px 0;">CIN ${p.cin}</p>` : ''}
      ${renderPhotoGallery(fotoPubbliche(p))}
      ${p.descrizioneAnnuncio ? `<p style="font-size:13.5px;line-height:1.6;color:var(--ink);margin:4px 0 18px 0;white-space:pre-line;">${p.descrizioneAnnuncio}</p>` : ''}
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;">
        ${(p.capacitaAdulti||p.capacitaBambini) ? `<span><i class="ti ti-user"></i> Fino a ${p.capacitaAdulti||0} adult${p.capacitaAdulti===1?'o':'i'}${p.capacitaBambini?` + ${p.capacitaBambini} bambin${p.capacitaBambini===1?'o':'i'}`:''}</span>` : ''}
        <span>${p.animaliAmmessi ? '<i class="ti ti-dog"></i> Animali ammessi' : '<i class="ti ti-ban"></i> Animali non ammessi'}</span>
      </div>
      ${renderCaratteristicheAnnuncio(p)}
      <div class="chart-card">
        <p class="section-label" style="margin-top:0;">Il tuo soggiorno</p>
        <table>
          <tbody>
            <tr><td>${fmtDate(state.guestDates.checkin)} → ${fmtDate(state.guestDates.checkout)} (${calcolo.notti} nott${calcolo.notti===1?'e':'i'})</td><td class="cell-num">${fmtCurrency(calcolo.soggiornoBase)}</td></tr>
            ${righeServizi}
          </tbody>
        </table>
        <div class="chart-total" style="margin-top:6px;">Totale: <span style="background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">${fmtCurrency(calcolo.totale)}</span></div>
      </div>
      <button class="btn-primary" data-guest-wizard-next="4" style="width:100%;">Prenota questo immobile</button>
    </div>`;
  }

  // ---- Step 4: dati anagrafici e documento ----
  if(step===4){
    const bd = state.guestBookingData;
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-wizard-back="3" style="margin-bottom:16px;">← Torna ai dettagli</button>
      ${renderWizardSteps(4)}
      <h1 class="page-title">I tuoi dati</h1>
      <p class="page-sub">Servono per completare la prenotazione.</p>
      <form id="guestDataForm">
        <div class="field-row">
          <div class="field"><label>Nome</label><input name="nomeProprio" required value="${bd.nomeProprio||''}"></div>
          <div class="field"><label>Cognome</label><input name="cognome" required value="${bd.cognome||''}"></div>
        </div>
        <div class="field"><label>Telefono</label><input name="telefono" required value="${bd.telefono||''}" placeholder="+39..."></div>
        <div class="field"><label>Indirizzo di residenza</label><input name="indirizzo" required value="${bd.indirizzo||''}" placeholder="Via, città, provincia"></div>
        <p style="font-size:12px;color:var(--ink-soft);margin:-6px 0 14px 0;">${state.guestDates.adulti} adult${state.guestDates.adulti===1?'o':'i'}${state.guestDates.bambini?`, ${state.guestDates.bambini} bambin${state.guestDates.bambini===1?'o':'i'}`:''}${state.guestDates.animali?`, ${state.guestDates.animali} animal${state.guestDates.animali===1?'e':'i'}`:''} · <button type="button" class="link-btn" data-guest-wizard-back="1" style="font-size:12px;">modifica</button></p>
        <div class="field"><label>Note (facoltativo)</label><input name="note" value="${bd.note||''}" placeholder="Richieste particolari"></div>
        <div class="field"><label>Copia del documento d'identità</label><input type="file" name="documento" accept="image/*" ${bd.documento?'':'required'}></div>
        ${bd.documento ? `<p style="font-size:11px;color:var(--sage);margin:-10px 0 14px 0;">✓ Documento già caricato — ricaricalo solo se vuoi sostituirlo.</p>` : `<p style="font-size:11px;color:var(--ink-soft);margin:-10px 0 14px 0;">Richiesto per la registrazione degli ospiti, come da normativa.</p>`}
        <button type="submit" class="btn-primary" style="width:100%;margin-top:8px;">Continua</button>
      </form>
    </div>`;
  }

  // ---- Step 5: pagamento e conferma finale ----
  const bd = state.guestBookingData;
  const haLinkPagamento = !!p.linkPagamento;
  return `<div class="portal-shell" style="max-width:760px;">
    <button class="link-btn" data-guest-wizard-back="4" style="margin-bottom:16px;">← Modifica i tuoi dati</button>
    ${renderWizardSteps(5)}
    <h1 class="page-title">${haLinkPagamento ? 'Pagamento e conferma' : 'Conferma la tua richiesta'}</h1>
    <div class="chart-card" style="margin-bottom:20px;">
      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin-bottom:6px;">${p.nome}</div>
      <div style="font-size:13px;color:var(--ink-soft);">${p.indirizzo||'—'} · ${p.tipo}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${fmtDate(state.guestDates.checkin)} → ${fmtDate(state.guestDates.checkout)} · ${calcolo.notti} nott${calcolo.notti===1?'e':'i'}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${bd.nomeProprio} ${bd.cognome} · ${bd.telefono}</div>
      <div style="font-size:13px;color:var(--ink-soft);">${bd.indirizzo}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${state.guestDates.adulti} adult${state.guestDates.adulti===1?'o':'i'}${state.guestDates.bambini?`, ${state.guestDates.bambini} bambin${state.guestDates.bambini===1?'o':'i'}`:''}${state.guestDates.animali?`, ${state.guestDates.animali} animal${state.guestDates.animali===1?'e':'i'} domestic${state.guestDates.animali===1?'o':'i'}`:''}</div>
      ${bd.note ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">Nota: ${bd.note}</div>` : ''}
      <div class="chart-total" style="margin-top:14px;">Totale: <span style="background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">${fmtCurrency(calcolo.totale)}</span></div>
    </div>
    ${haLinkPagamento ? `
      <ol style="font-size:13px;color:var(--ink-soft);padding-left:18px;margin-bottom:20px;">
        <li style="margin-bottom:6px;">Vai al pagamento e completalo per l'importo indicato sopra.</li>
        <li>Torna qui e premi "Ho pagato, conferma la prenotazione".</li>
      </ol>
      <a class="btn-primary" href="${p.linkPagamento}" target="_blank" rel="noopener" id="guestGoToPayment" style="width:100%;display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-bottom:10px;">Vai al pagamento</a>
      <button class="btn-secondary" id="guestConfirmSubmit" style="width:100%;">Ho pagato, conferma la prenotazione</button>
      <p style="font-size:11px;color:var(--ink-soft);margin-top:10px;">L'agenzia verificherà il pagamento e ti confermerà la prenotazione.</p>
    ` : `
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;">Il pagamento verrà concordato direttamente con l'agenzia dopo la conferma.</p>
      <button class="btn-primary" id="guestConfirmSubmit" style="width:100%;">Conferma e invia richiesta</button>
    `}
  </div>`;
}

// ---------- Top nav ----------
function renderNotifBellHtml(pendingVoci, attivita, badgeTotale, gotoAttr, gotoNotificaAttr){
  const pendingHtml = pendingVoci.length
    ? pendingVoci.map(v=>`<div class="notif-item" data-${gotoAttr}="${v.tipo}"><span class="n-dot"></span><span>${v.txt}</span></div>`).join('')
    : '';
  const attivitaHtml = attivita.length
    ? attivita.slice(0,20).map(n=>`
      <div class="notif-item ${n.letto?'':'unread'}" ${n.tab?`data-${gotoNotificaAttr}="${n.propId}::${n.tab}"`:''}>
        <span class="n-dot ${n.letto?'read':''}"></span>
        <span>${n.testo}${n.propNome?` <span style="color:var(--ink-soft);">· ${n.propNome}</span>`:''}<div class="notif-item-sub">${fmtDate(n.data)}</div></span>
      </div>`).join('')
    : '';
  const sezioni = [];
  if(pendingHtml) sezioni.push(`<div class="notif-panel-title">Da fare</div>${pendingHtml}`);
  if(attivitaHtml) sezioni.push(`<div class="notif-panel-title">Attività recenti</div>${attivitaHtml}`);
  const corpo = sezioni.length ? sezioni.join('') : `<div class="notif-empty">Nessuna notifica al momento.</div>`;
  return `
    <div class="notif-wrap">
      <button type="button" class="notif-btn" data-action="toggle-notif" aria-label="Notifiche">

function renderNotificheGestore(alert){
  const voci = [
    alert.prenotazioniPendenti>0 ? {tipo:'prenotazioni', txt:`${alert.prenotazioniPendenti} richiest${alert.prenotazioniPendenti>1?'e':'a'} di prenotazione da confermare o rifiutare`} : null,
    alert.spesePagare>0 ? {tipo:'spese', txt:`${alert.spesePagare} spes${alert.spesePagare>1?'e':'a'} approvat${alert.spesePagare>1?'e':'a'} da pagare`} : null,
    alert.controlliRitardo>0 ? {tipo:'controlli', txt:`${alert.controlliRitardo} immobil${alert.controlliRitardo>1?'i':'e'} con controllo periodico in ritardo`} : null,
    alert.preventiviRisposti>0 ? {tipo:'interventi', txt:`${alert.preventiviRisposti} preventiv${alert.preventiviRisposti>1?'i':'o'} con risposta del proprietario da gestire`} : null,
    alert.interventiDaTriage>0 ? {tipo:'interventi-nuovi', txt:`${alert.interventiDaTriage} nuov${alert.interventiDaTriage>1?'i':'o'} intervent${alert.interventiDaTriage>1?'i':'o'} da valutare`} : null,
    alert.messaggiProprietario>0 ? {tipo:'messaggi', txt:`${alert.messaggiProprietario} messagg${alert.messaggiProprietario>1?'i':'io'} dal proprietario non lett${alert.messaggiProprietario>1?'i':'o'}`} : null,
    alert.messaggiOspiti>0 ? {tipo:'messaggi-ospiti', txt:`${alert.messaggiOspiti} messagg${alert.messaggiOspiti>1?'i':'io'} da${alert.messaggiOspiti>1?' ospiti':' un ospite'} non lett${alert.messaggiOspiti>1?'i':'o'}`} : null,
  ].filter(Boolean);
  const attivita = notificheNonLette(state.properties, 'gestore');
  const nonLette = attivita.filter(n=>!n.letto).length;
  return renderNotifBellHtml(voci, attivita, alert.totale + nonLette, 'goto-alert', 'goto-notifica-gestore');
}
function renderNotificheProprietario(mieiImmobili, alertProprietario){
  const voci = [
    alertProprietario.preventiviInAttesa>0 ? {tipo:'interventi', txt:`${alertProprietario.preventiviInAttesa} preventiv${alertProprietario.preventiviInAttesa>1?'i':'o'} in attesa della tua approvazione`} : null,
    alertProprietario.speseInAttesa>0 ? {tipo:'spese', txt:`${alertProprietario.speseInAttesa} spes${alertProprietario.speseInAttesa>1?'e':'a'} in attesa della tua approvazione`} : null,
    alertProprietario.controlloInRitardo>0 ? {tipo:'controlli', txt:'Controllo periodico in ritardo'} : null,
  ].filter(Boolean);
  const attivita = notificheNonLette(mieiImmobili, 'proprietario');
  const nonLette = attivita.filter(n=>!n.letto).length;
  return renderNotifBellHtml(voci, attivita, voci.length + nonLette, 'goto-owner-alert', 'goto-notifica-owner');
}
function renderTopNav(){
  const alert = calcolaAlertPortfolio();
  let ownerBell = '';
  if(state.ownerAuth && state.view==='proprietari'){
    const clienteLoggato = getClienteByEmail(state.ownerAuth.email);
    const mieiImmobili = clienteLoggato ? state.properties.filter(x=>x.clienteId===clienteLoggato.id) : [];
    if(mieiImmobili.length){
      const pCorrente = mieiImmobili.find(x=>x.id===state.ownerPropId) || mieiImmobili[0];
      const alertProprietario = calcolaAlertProprietario(pCorrente);
      ownerBell = renderNotificheProprietario(mieiImmobili, alertProprietario);
    }
  }
  const isOspiti = state.view==='ospiti';
  return `<div class="topnav ${state.view==='gestore' && state.vistaGestore==='overview' && !state.selectedId && !state.selectedClienteId ? 'vpm-topnav-dashboard' : 'vpm-topnav-workspace'}">
    <div class="topnav-brand"><label class="vpm-global-search"><i class="ti ti-search"></i><input id="vpm-global-search" type="search" placeholder="Cerca immobili, prenotazioni, ospiti..." aria-label="Cerca immobili"></label></div>
    <div class="topnav-tabs">
      ${!isOspiti ? `
        <button class="tab-btn ${state.view==='gestore'?'active':''}" data-view="gestore">Gestore${alert.totale>0?`<span class="nav-badge">${alert.totale}</span>`:''}</button>
        <button class="tab-btn ${state.view==='proprietari'?'active':''}" data-view="proprietari">Area Proprietari</button>
      ` : ''}
      <button class="tab-btn ${state.view==='ospiti'?'active':''}" data-view="ospiti">Prenota un soggiorno</button>
      ${(state.gestoreUnlocked && state.view==='gestore') ? renderNotificheGestore(alert) : ''}
      ${ownerBell}
    </div>
  </div>`;
}

function renderModal(){
  const html=renderModalRaw();
  if(!html || !state.modal)return html;
  const type=state.modal.type||'';
  const icons={
    cliente:'ti-user-plus',operatore:'ti-user-shield',servizio:'ti-sparkles',
    fotoImmobile:'ti-photo-plus',documentoImmobile:'ti-file-upload',
    property:'ti-home-plus',expense:'ti-receipt',pagaSpesa:'ti-circle-check',
    pagamentoBooking:'ti-credit-card',contrattoGestione:'ti-file-certificate',
    payment:'ti-wallet',voceListino:'ti-tags',versamento:'ti-cash',
    controllo:'ti-clipboard-check',maintenance:'ti-tools',
    programmaIntervento:'ti-calendar-event',fotoIntervento:'ti-camera',
    preventivo:'ti-file-invoice',completaIntervento:'ti-circle-check',
    settings:'ti-settings'
  };
  const titleMatch=html.match(/<h2>([\s\S]*?)<\/h2>/);
  if(!titleMatch)return html;
  const icon=icons[type]||'ti-sparkles';
  const heading='<header class="vpm-modal-head"><div class="vpm-modal-eyebrow"><span class="vpm-modal-brand">VIVERE<span>PM</span></span><span class="vpm-modal-category">GESTIONE IMMOBILI</span></div><span class="vpm-modal-tagline">Valore ai tuoi spazi <i class="ti ti-heart"></i></span><button type="button" class="vpm-modal-x" data-close aria-label="Chiudi finestra"><i class="ti ti-x"></i></button><div class="vpm-modal-title-row"><span class="vpm-modal-title-icon"><i class="ti '+icon+'"></i></span><div><span class="vpm-modal-kicker">VIVEREPM · '+(type==='property'?'IMMOBILI':type==='cliente'?'PROPRIETARI':type==='maintenance'||type==='programmaIntervento'||type==='completaIntervento'?'INTERVENTI':'GESTIONE')+'</span><h2>'+titleMatch[1]+'</h2>'+(type==='cliente'?'<p class="vpm-modal-subtitle">Registra i dati del proprietario e prepara il suo accesso.</p>':'')+'</div></div></header>';
  return html.replace('<div class="modal" data-stop>','<div class="modal vpm-modal-premium vpm-modal-'+type+'" data-stop role="dialog" aria-modal="true">')
    .replace(titleMatch[0],heading);
}

function render(){

    root.innerHTML = `<div class="loading">Caricamento portfolio…</div>`;
    return;
  }
  if(state.notConfigured){
    root.innerHTML = `<div class="portal-shell" style="text-align:center;">

        Apri il file con un editor di testo, cerca "CONFIGURAZIONE SUPABASE" all'inizio dello script e inserisci

    const selected = state.properties.find(p=>p.id===state.selectedId);
    const clienteSelezionato = state.selectedClienteId ? state.clienti.find(c=>c.id===state.selectedClienteId) : null;
    let main;
    if(selected && !immobileConsentito(selected.id)) main = `<div class="portal-shell"><h1 class="page-title">Accesso non consentito</h1><p class="page-sub">Non hai i permessi per vedere questo immobile.</p></div>`;
    else if(selected) main = renderDossier(selected);
    else if(clienteSelezionato) main = renderClienteCRM(clienteSelezionato);
    else if(state.vistaGestore==='tutte-prenotazioni') main = renderTuttePrenotazioni();
    else if(state.vistaGestore==='immobili') main = renderImmobili();
    else if(state.vistaGestore==='clienti') main = renderClientiPortfolio();
    else if(state.vistaGestore==='attivita') main = renderAttivitaPortfolio();
    else if(state.vistaGestore==='contabilita') main = renderContabilitaPortfolio();
    else if(state.vistaGestore==='comunicazioni') main = renderComunicazioniPortfolio();
    else main = renderOverview();
    content = `<div class="app">${renderSidebar()}<main>${main}</main></div>`;
  }
  const errorBanner = state.error ? `<div style="background:#F1DAD1;color:var(--terracotta);padding:10px 20px;font-size:13px;text-align:center;">${state.error} <button data-clear-error style="background:none;border:none;color:var(--terracotta);text-decoration:underline;cursor:pointer;margin-left:8px;">chiudi</button></div>` : '';
  if(state.view==='gestore'&&state.gestoreUnlocked){
    if(state.selectedId&&immobiliVisibili().some(p=>p.id===state.selectedId))vpmRememberRecent('properties',state.selectedId);
    if(state.selectedClienteId&&state.clienti.some(c=>c.id===state.selectedClienteId))vpmRememberRecent('clients',state.selectedClienteId);
  }
  root.innerHTML = renderTopNav() + errorBanner + content + renderModal();

}

function animateBentoNumbers(){
  const els = document.querySelectorAll('.bento-value[data-count], .stat-value[data-count]');
  if(!els.length) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  els.forEach(el=>{
    const target = parseFloat(el.getAttribute('data-count'))||0;
    const isCurrency = el.getAttribute('data-format')==='currency';
    if(reduce){ el.textContent = isCurrency ? fmtCurrency(target) : String(target); return; }
    const start = performance.now(), dur = 850;
    function step(ts){
      const p = Math.min(1, (ts-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      const val = target*eased;
      el.textContent = isCurrency ? fmtCurrency(val) : Math.round(val);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
