<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>ViverePM | Gestione immobili</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12302C">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ViverePM">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#241F1A;
    --ink-soft:#6E6558;
    --paper:#F3EFE7;
    --paper-raised:#FBF9F4;
    --brass:#0ABAB5;
    --brass-soft:#D6EFEC;
    --brass-deep:#0F8C86;
    --terracotta:#BC4632;
    --sage:#3E8C6E;
    --line:#DEDACB;
    --line-soft:#E9E4D5;
    --surface-dark:#12302C;
    --surface-dark-2:#193B36;
    --text-on-dark:#EAF6F3;
    --text-on-dark-soft:#9AC7C0;
    --tiffany:#7FEDE0;
    --coral:#F4845F;
    --brand-gradient: linear-gradient(120deg, var(--brass-deep) 0%, var(--brass) 55%, var(--tiffany) 100%);
  }
  *{box-sizing:border-box;}
  .ti{vertical-align:-2px; margin-right:3px; font-size:1em;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top nav (selettore vista) ---------- */
  .topnav{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 32px; border-bottom:1px solid var(--brass-deep);
    background:linear-gradient(180deg,var(--surface-dark) 0%, var(--surface-dark-2) 100%);
    flex-wrap:wrap; gap:10px;
  }
  .topnav-brand{
    font-family:'Fraunces',serif; font-weight:600; font-size:17px; letter-spacing:.03em;
    color:var(--brass-soft); text-transform:uppercase; font-size:14px; letter-spacing:.14em;
  }
  .topnav-tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab-btn{
    background:none; border:1px solid rgba(47,184,170,0.35); padding:8px 16px; border-radius:8px;
    font-size:12px; cursor:pointer; color:var(--text-on-dark-soft); font-family:'IBM Plex Sans',sans-serif;
    letter-spacing:.03em; transition:all .15s ease;
  }
  .tab-btn:hover{border-color:var(--brass); color:var(--text-on-dark);}
  .tab-btn.active{background:var(--brass); color:var(--surface-dark); border-color:var(--brass); font-weight:600;}

  .nav-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px;
    background:var(--terracotta); color:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; padding:0 5px; border-radius:20px; margin-left:6px; vertical-align:middle;
  }

  /* ---- campanella notifiche (riusa gli alert reali del portfolio) ---- */
  .notif-wrap{position:relative;}
  .notif-btn{
    position:relative; border:1px solid rgba(47,184,170,0.35); background:none; color:var(--text-on-dark);
    width:36px; height:36px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .15s ease, color .15s ease;
  }
  .notif-btn:hover{border-color:var(--brass); color:var(--brass);}
  .notif-badge{
    position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 3px;
    background:var(--terracotta); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700;
    border-radius:20px; display:flex; align-items:center; justify-content:center;
  }
  .notif-panel{
    position:absolute; top:46px; right:0; width:300px; z-index:60;
    background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:10px; padding:6px;
    box-shadow:0 14px 34px rgba(28,26,23,.22);
    opacity:0; transform:translateY(-8px) scale(.95); pointer-events:none;
    max-height:420px; overflow-y:auto;
  }
  .notif-panel.show{animation:notifIn .35s cubic-bezier(.22,1.4,.4,1) forwards; pointer-events:auto;}
  @keyframes notifIn{ 0%{opacity:0; transform:translateY(-10px) scale(.92);} 100%{opacity:1; transform:translateY(0) scale(1);} }
  .notif-panel-title{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); padding:9px 10px 7px;}
  .notif-item{display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--ink); line-height:1.4;}
  .notif-item:hover{background:var(--brass-soft);}
  .notif-item .n-dot{width:7px; height:7px; border-radius:50%; background:var(--terracotta); margin-top:5px; flex-shrink:0;}
  .notif-item.unread{background:var(--brass-soft);}
  .notif-item.unread .n-dot{background:var(--brass-deep);}
  .notif-item .n-dot.read{background:var(--line);}
  .notif-item-sub{font-size:10px; color:var(--ink-soft); margin-top:2px;}
  .notif-empty{padding:16px 10px; font-size:12.5px; color:var(--ink-soft); text-align:center;}

  .alert-banner{
    background:#F1DAD1; border:1px solid var(--terracotta); border-radius:8px;
    padding:16px 20px; margin-bottom:28px;
  }
  .alert-banner-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--terracotta); margin-bottom:8px;}
  .alert-banner-item{font-size:13px; color:var(--ink); padding:2px 0;}
  .alert-banner-item b{color:var(--terracotta);}
  .alert-banner-item.clickable{cursor:pointer; text-decoration:underline; text-decoration-color:transparent; transition:text-decoration-color .15s ease;}
  .alert-banner-item.clickable:hover{text-decoration-color:var(--terracotta);}

  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:calc(100vh - 61px);
  }
  @media (max-width:760px){
    .app{grid-template-columns:1fr;}
    .sidebar{border-right:none;border-bottom:1px solid var(--line);}
  }

  /* ---------- Sidebar (schedario) ---------- */
  .sidebar{
    border-right:1px solid var(--brass-deep);
    padding:28px 18px;
    background:linear-gradient(180deg,var(--surface-dark) 0%, var(--surface-dark-2) 100%);
    position:relative;
  }
  .sidebar::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--brand-gradient);
  }
  .brand{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:.01em;
    color:var(--text-on-dark);
    margin:0 0 2px 0;
  }
  .brand-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-on-dark-soft);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin:0 0 26px 0;
    display:flex; align-items:center; gap:8px;
  }
  .brand-sub::after{ content:''; flex:1; height:1px; background:var(--text-on-dark-soft); opacity:.25; }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px;
    border-radius:10px;
    margin-bottom:3px;
    cursor:pointer;
    font-size:14px;
    color:var(--text-on-dark-soft);
    position:relative;
    transition:background .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease;
  }
  .nav-item:hover{background:rgba(127,237,224,0.08); color:var(--text-on-dark); transform:translateX(3px);}
  .nav-item.active{
    background:linear-gradient(90deg, rgba(10,186,181,0.28), rgba(127,237,224,0.05));
    color:var(--text-on-dark); font-weight:600;
    box-shadow:inset 3px 0 0 var(--tiffany), 0 2px 10px rgba(10,186,181,0.15);
  }
  .nav-item .code{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-on-dark-soft); opacity:.7;}
  .nav-item-main{display:flex; align-items:center;}
  .nav-icon{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:26px; height:26px; border-radius:8px; margin-right:10px; font-size:14px;
    background:rgba(255,255,255,0.05); color:var(--tiffany);
    transition:background .18s ease;
  }
  .nav-item.active .nav-icon{background:rgba(127,237,224,0.2);}
  .nav-section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--text-on-dark-soft); opacity:.65; margin:26px 0 8px 4px;
    display:flex; align-items:center; gap:6px;
  }
  .nav-section-label::before{ content:''; width:10px; height:1px; background:var(--tiffany); opacity:.7; flex-shrink:0; }
  .badge-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-left:8px;}
  .btn-new{
    width:100%;
    margin-top:18px;
    padding:12px 12px;
    background:var(--brand-gradient);
    color:var(--surface-dark);
    border:none;
    border-radius:10px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px; font-weight:700;
    cursor:pointer;
    letter-spacing:.05em;
    text-transform:uppercase;
    transition:filter .15s ease, transform .15s ease;
  }
  .btn-new:hover{filter:brightness(1.08); transform:translateY(-1px);}

  /* ---------- Main ---------- */
  main{padding:40px 48px; max-width:920px;}
  @media (max-width:760px){ main{padding:24px 20px;} }
  h1.page-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:33px; letter-spacing:-.01em;
    margin:0 0 4px 0;
  }
  .page-sub{color:var(--ink-soft); font-size:14px; margin:0 0 32px 0;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:36px;}
  @media (max-width:760px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
  .stat-card{
    background:var(--line-soft);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:18px 20px;
    box-shadow:0 1px 2px rgba(28,26,23,0.04);
  }
  .stat-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:9px;}
  .stat-value{font-family:'Fraunces',serif; font-size:25px; font-weight:600;}
  .stat-value.sage{color:var(--sage);}
  .stat-value.terracotta{color:var(--terracotta);}

  /* ---- riepilogo Panoramica in stile "bento" ---- */
  .bento-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:36px;}
  @media (max-width:700px){ .bento-row{grid-template-columns:repeat(2,1fr);} }
  .bento-tile{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:14px;
    padding:22px 22px; box-shadow:0 1px 3px rgba(28,26,23,0.05); position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
  }
  .bento-tile.alert{box-shadow:inset 3px 0 0 var(--terracotta), 0 1px 3px rgba(28,26,23,0.05);}
  .bento-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:14px;}
  .bento-value{font-family:'Fraunces',serif; font-size:24px; font-weight:700; background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap;}
  .bento-value.terracotta{background:none; -webkit-text-fill-color:initial; color:var(--terracotta);}
  .bento-tile .bento-sub{font-size:12.5px; color:var(--ink-soft); margin-top:10px;}

  .prop-type-icon{display:inline-flex; align-items:center; justify-content:center; vertical-align:-6px; margin-right:7px; width:24px; height:24px; border-radius:7px; border:1px solid var(--line-soft); color:var(--brass-deep); flex-shrink:0;}

  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:.14em; color:var(--brass-deep); margin:0 0 14px 0; padding-bottom:9px;
    border-bottom:1px solid var(--brass-soft);
  }

  /* ---- grafico guadagno agenzia, costruito da zero ---- */
  .chart-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:12px;
    padding:22px 24px; margin-bottom:24px;
  }
  .chart-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; flex-wrap:wrap; gap:8px;}
  .chart-head h4{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:500; margin:0;}
  .chart-total{font-family:'Fraunces',serif; font-weight:700; font-size:21px;}
  .chart-card svg{width:100%; height:auto; overflow:visible; margin-top:8px;}
  .chart-legend{display:flex; gap:18px; margin-top:8px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .chart-legend b{color:var(--ink); font-weight:500;}

  /* property cards - schede catastali */
  .prop-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
  .prop-card{
    position:relative;
    background:var(--line-soft);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    box-shadow:0 1px 3px rgba(28,26,23,0.05);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .prop-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(28,26,23,0.12); border-color:var(--brass);}
  .prop-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:2px;}
  .prop-card-main{display:flex; gap:12px; align-items:flex-start;}
  .prop-catasto{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em;}
  .prop-name{font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin:0 0 3px 0; display:flex; align-items:center;}
  .prop-addr{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .prop-value{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500;}
  .prop-rent{font-size:11.5px; font-family:'IBM Plex Mono',monospace; color:var(--sage); margin-bottom:4px;}
  .prop-rent.vacant{color:var(--ink-soft);}
  .prop-rent.expiring{color:var(--terracotta);}
  .prop-bookable{font-size:11px; color:var(--brass-deep); margin-bottom:6px; font-weight:500;}
  .prop-card-foot{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .prop-price{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink); font-weight:500;}
  .status-seal{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em; padding:3px 10px;
    border-radius:20px; border:1px solid currentColor; white-space:nowrap; flex-shrink:0;
  }
  .status-seal.ok{color:var(--sage);}
  .status-seal.prog{color:var(--brass-deep);}
  .status-seal.att{color:var(--terracotta);}
  .seal{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%;
    border:1.3px dashed var(--sage); color:var(--sage);
    font-size:11px; flex-shrink:0; transform:rotate(-6deg);
    margin-right:5px; vertical-align:-5px;
  }

  /* dossier detail */
  .dossier-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .dossier-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .dossier-tabs{
    display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 28px 0;
  }
  .dossier-tab-btn{
    background:var(--line-soft); border:1px solid var(--line-soft); padding:9px 15px 9px 12px;
    border-radius:20px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif; letter-spacing:.02em;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    transition:background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .dossier-tab-btn i{font-size:14px; margin-right:0;}
  .dossier-tab-btn:hover:not(.active){border-color:var(--brass); color:var(--ink);}
  .dossier-tab-btn.active{
    background:var(--brand-gradient); border-color:transparent; color:#fff; font-weight:600;
    box-shadow:0 3px 10px rgba(10,186,181,0.25);
  }

  .foto-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:10px;
    overflow:hidden; margin-bottom:12px; display:flex; gap:0;
  }
  .foto-card img{width:110px; height:100px; object-fit:cover; flex-shrink:0; border-radius:6px 0 0 6px;}
  .foto-card-body{padding:10px 14px; flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px;}
  .foto-card-desc{font-size:13px; color:var(--ink);}
  .foto-card-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .badge-copertina{
    display:inline-flex; align-items:center; gap:4px; background:var(--brass); color:var(--surface-dark);
    font-size:10px; font-weight:600; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;
  }
  .prop-cover{width:100%; height:130px; object-fit:cover; border-radius:12px 12px 0 0; margin:-20px -20px 14px -20px; width:calc(100% + 40px);}
  .icon-btn{
    background:none; border:1px solid var(--line); border-radius:8px;
    padding:7px 14px; font-size:12px; cursor:pointer; color:var(--ink-soft);
    font-family:'IBM Plex Sans',sans-serif; letter-spacing:.02em;
    transition:all .15s ease;
  }
  .icon-btn:hover{border-color:var(--brass); color:var(--brass-deep); background:var(--brass-soft);}
  .icon-btn.danger:hover{border-color:var(--terracotta); color:var(--terracotta); background:transparent;}

  .info-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:24px 0 36px 0;}
  @media (max-width:760px){ .info-grid{grid-template-columns:repeat(2,1fr);} }

  table{width:100%; border-collapse:collapse; margin-bottom:36px;}
  th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  td{padding:10px 10px; border-bottom:1px solid var(--line-soft); font-size:13.5px; vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .cell-num{font-family:'IBM Plex Mono',monospace;}
  .row-actions{text-align:right;}
  .link-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;}
  .link-btn:hover{color:var(--terracotta);}
  .empty-row{color:var(--ink-soft); font-style:italic; font-size:13px; padding:16px 10px;}

  .status-pill{
    display:inline-block; padding:2px 8px; border-radius:20px;
    font-size:11px; font-family:'IBM Plex Mono',monospace;
  }
  .status-pill.programmata{background:var(--brass-soft); color:var(--brass-deep);}
  .status-pill.in-corso{background:#F1DAD1; color:var(--terracotta);}
  .status-pill.completata{background:#DCE6DE; color:var(--sage);}
  .status-pill.clickable{display:inline-flex; align-items:center; gap:3px; cursor:pointer; border:1px solid transparent; transition:filter .15s ease;}
  .status-pill.clickable:hover{filter:brightness(0.93);}
  .status-pill.clickable i{font-size:10px;}

  .add-inline{
    background:none; border:1px dashed var(--brass-soft); color:var(--brass-deep);
    border-radius:8px; padding:9px 16px; font-size:12.5px; cursor:pointer; margin-bottom:36px; font-family:'IBM Plex Sans',sans-serif; letter-spacing:.02em;
    transition:all .15s ease;
  }
  .add-inline:hover{border-color:var(--brass); background:var(--brass-soft);}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(33,44,54,0.45);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-raised); border-radius:6px; padding:28px 30px;
    width:100%; max-width:440px; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal h2{font-family:'Fraunces',serif; font-size:20px; margin:0 0 20px 0;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:4px; font-size:14px; font-family:'IBM Plex Sans',sans-serif;
    background:#fff; color:var(--ink); transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--brass); }
  .field input[type=checkbox]{width:auto;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-subsection{background:var(--line-soft); border-radius:10px; padding:14px 14px 2px; margin:10px 0 14px 0;}
  .form-subsection .field textarea{background:var(--paper-raised);}
  .amenity-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; margin-bottom:14px;}
  @media (max-width:500px){ .amenity-grid{grid-template-columns:1fr;} }
  .field label.amenity-chip{
    display:flex; align-items:center; gap:7px; font-size:13px; font-family:'IBM Plex Sans',sans-serif;
    text-transform:none; letter-spacing:normal; margin-bottom:0;
    color:var(--ink); background:var(--paper-raised); border:1px solid var(--line); border-radius:7px;
    padding:8px 10px; cursor:pointer;
  }
  .amenity-chip input{width:auto;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}
  .btn-primary{
    background:var(--brand-gradient); color:#fff; border:1px solid transparent;
    padding:11px 20px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    letter-spacing:.03em; transition:filter .15s ease, transform .15s ease;
  }
  .btn-primary:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .btn-secondary{
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:11px 20px; border-radius:8px; cursor:pointer; font-size:13px; letter-spacing:.02em;
    transition:all .15s ease;
  }
  .btn-secondary:hover{border-color:var(--ink-soft); color:var(--ink);}

  .loading, .empty-state{
    padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
  }
  .empty-state .big{font-family:'Fraunces',serif; font-size:19px; color:var(--ink); margin-bottom:6px;}

  .tenant-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-left:3px solid var(--terracotta); border-radius:10px;
    padding:18px 20px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;
    box-shadow:0 1px 3px rgba(28,26,23,0.05);
  }
  .tenant-name{font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0 0 4px 0;}
  .tenant-meta{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .tenant-meta .warn{color:var(--terracotta); font-weight:500;}
  .tenant-actions{display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; align-items:flex-start;}
  .vacant-box{
    border:1px dashed var(--brass-soft); border-radius:6px; padding:20px; margin-bottom:18px;
    display:flex; justify-content:space-between; align-items:center; color:var(--ink-soft); font-size:13.5px; flex-wrap:wrap; gap:10px;
  }

  /* WhatsApp */
  .wa-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--brass-deep); color:#fff;
    border:none; padding:8px 15px; border-radius:8px; font-size:12px; cursor:pointer;
    text-decoration:none; font-family:'IBM Plex Sans',sans-serif; white-space:nowrap;
    transition:filter .15s ease;
  }
  .wa-btn:hover{filter:brightness(1.1);}

  /* client portals */
  .portal-shell{max-width:620px; margin:0 auto; padding:52px 24px;}
  @media (max-width:760px){ .portal-shell{padding:28px 18px;} }
  .auth-card{
    max-width:380px; margin:0 auto; background:var(--paper-raised); border:1px solid var(--line-soft);
    border-radius:16px; padding:40px 36px; box-shadow:0 4px 24px rgba(28,26,23,0.06);
  }
  .auth-brand{font-family:'Fraunces',serif; font-weight:700; font-style:italic; font-size:15px; color:var(--brass-deep); margin-bottom:18px; letter-spacing:.01em;}
  .field input, .field select, .field textarea{ border-radius:8px; }
  .field input:focus, .field select:focus, .field textarea:focus{ box-shadow:0 0 0 3px rgba(10,186,181,.16); }
  .portal-picker{display:grid; gap:10px; margin-top:20px;}
  .portal-pick-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:12px;
    padding:18px 20px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 1px 3px rgba(28,26,23,0.05);
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .portal-pick-card:hover{border-color:var(--brass); transform:translateY(-2px); box-shadow:0 8px 20px rgba(28,26,23,0.1);}

  /* ---- Prenota un soggiorno: vetrina pubblica ---- */
  .guest-hero{
    position:relative; overflow:hidden; border-radius:18px; padding:38px 34px; margin-bottom:24px;
    background:linear-gradient(135deg, var(--surface-dark) 0%, var(--surface-dark-2) 100%);
  }
  .guest-hero::before{
    content:''; position:absolute; inset:0; background:var(--brand-gradient); opacity:.16; pointer-events:none;
  }
  .guest-hero-brand{
    position:relative; font-family:'Fraunces',serif; font-weight:700; font-style:italic; font-size:14px;
    color:var(--tiffany); letter-spacing:.02em; margin-bottom:12px;
  }
  .guest-hero h1{position:relative; font-family:'Fraunces',serif; font-weight:700; font-size:32px; line-height:1.18; color:var(--text-on-dark); margin:0 0 10px 0;}
  .guest-hero p{position:relative; font-size:14px; color:var(--text-on-dark-soft); margin:0; max-width:460px;}
  @media (max-width:600px){ .guest-hero{padding:28px 22px;} .guest-hero h1{font-size:25px;} }

  .guest-prop-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px; margin-top:20px;}
  .guest-prop-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; cursor:pointer;
    box-shadow:0 1px 3px rgba(28,26,23,0.05);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .guest-prop-card:hover{transform:translateY(-4px); box-shadow:0 16px 34px rgba(28,26,23,0.14); border-color:var(--brass);}
  .guest-prop-card-img{width:100%; height:170px; object-fit:cover; display:block;}
  .guest-prop-card-img.placeholder{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--brass-soft), var(--line-soft) 75%); color:var(--brass-deep);
  }
  .guest-prop-card-img.placeholder .prop-type-icon{width:44px; height:44px; border:none;}
  .guest-prop-card-img.placeholder .prop-type-icon svg{width:24px; height:24px;}
  .guest-prop-card-body{padding:16px 18px 18px;}
  .guest-prop-card-name{font-family:'Fraunces',serif; font-weight:700; font-size:18px; margin-bottom:2px;}
  .guest-prop-card-addr{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .guest-prop-card-feat{font-size:11.5px; color:var(--ink-soft); margin-bottom:12px;}
  .guest-prop-card-foot{display:flex; justify-content:space-between; align-items:baseline; padding-top:12px; border-top:1px solid var(--line);}
  .guest-prop-card-price{font-family:'Fraunces',serif; font-weight:700; font-size:19px; background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .guest-prop-card-nights{font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .guest-confirm-mark{
    width:64px; height:64px; border-radius:50%; margin:0 auto 20px; background:var(--brand-gradient);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow:0 8px 24px rgba(10,186,181,0.3); animation:stampIn .55s cubic-bezier(.22,1.6,.4,1) forwards;
  }

  .photo-strip{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px 0;}
  .photo-thumb{width:56px; height:56px; object-fit:cover; border-radius:4px; border:1px solid var(--line-soft);}
  .photo-thumb-wrap{position:relative; display:inline-block;}
  .photo-thumb-remove{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--terracotta); color:#fff; border:none; font-size:11px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .prop-gallery{display:flex; gap:10px; overflow-x:auto; margin:16px 0 26px 0; padding-bottom:4px;}
  .prop-gallery img{width:150px; height:106px; object-fit:cover; border-radius:8px; border:1.5px solid var(--brass-soft); flex-shrink:0;}

  .commitment-box{
    background:var(--line-soft); border:1px solid var(--brass-soft); border-radius:10px;
    padding:16px 20px; margin:16px 0 26px 0;
  }
  .commitment-box ul{margin:0; padding-left:0; list-style:none;}
  .commitment-box li{
    display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--ink);
    padding:5px 0;
  }
  .commitment-box li::before{content:'✓'; color:var(--brass-deep); font-weight:700; flex-shrink:0;}

  .checkin-row{
    background:var(--paper-raised); border:1px solid var(--line-soft); border-left:3px solid var(--sage); border-radius:6px;
    padding:14px 16px; margin-bottom:10px;
  }
  .checkin-date{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--brass-deep); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}

  .intervento-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-left:3px solid var(--brass); border-radius:10px;
    padding:16px 18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(28,26,23,0.05);
    position:relative; overflow:visible;
  }
  .intervento-titolo{font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:4px;}
  .intervento-meta{font-size:11px; color:var(--ink-soft); margin-bottom:8px;}
  .preventivo-box{
    background:var(--brass-soft); border-radius:6px; padding:12px 14px; margin:10px 0; font-size:13px;
    position:relative; overflow:visible;
  }

  /* ---- timbro animato di conferma/rifiuto ---- */
  .stamp-mark{
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
    width:58px; height:58px; border-radius:50%; border:2px solid currentColor;
    font-family:'IBM Plex Mono',monospace; font-size:8px; font-weight:600; letter-spacing:.02em; text-transform:uppercase;
    position:absolute; right:8px; top:8px; pointer-events:none; z-index:5;
    background:rgba(255,255,255,.85);
    box-shadow:0 4px 14px rgba(28,26,23,.15);
    opacity:0; transform:scale(2.4) rotate(-16deg);
  }
  .stamp-mark::before{ content:''; position:absolute; inset:3px; border:1px solid currentColor; border-radius:50%; opacity:.6; }
  .stamp-mark.ok{ color:var(--sage); }
  .stamp-mark.crit{ color:var(--terracotta); }
  .stamp-mark.show{ animation:stampIn .55s cubic-bezier(.22,1.6,.4,1) forwards; }
  @keyframes stampIn{
    0%{ opacity:0; transform:scale(2.8) rotate(-16deg); }
    55%{ opacity:1; transform:scale(.9) rotate(-9deg); }
    100%{ opacity:1; transform:scale(1) rotate(-11deg); }
  }
  .preventivo-box .importo{font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--brass-deep);}
  .btn-approva{background:var(--sage); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; margin-right:8px;}
  .btn-rifiuta{background:none; border:1px solid var(--terracotta); color:var(--terracotta); padding:8px 16px; border-radius:8px; font-size:12.5px; cursor:pointer;}
  .storico-list{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); max-height:220px; overflow-y:auto;}
  .storico-item{font-size:11.5px; color:var(--ink-soft); padding:3px 0;}
  .storico-item .storico-data{font-family:'IBM Plex Mono',monospace; color:var(--brass-deep); margin-right:6px;}

  .empty-inline{
    background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:6px;
    padding:14px 16px; font-size:13px; color:var(--ink-soft); margin-bottom:16px;
  }
  .archivio-toggle{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:6px;
    padding:12px 16px; margin:20px 0 0 0; cursor:pointer; font-size:13.5px; color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif; font-weight:500; transition:border-color .15s ease;
  }
  .archivio-toggle:hover{border-color:var(--brass);}
  .archivio-toggle .chev{color:var(--brass-deep); font-size:11px;}
  .archivio-toggle .count{
    margin-left:auto; background:var(--brass-soft); color:var(--brass-deep);
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 9px; border-radius:20px;
  }
  .archivio-body{margin:12px 0 20px 0; padding-left:2px;}

  .wizard-steps{display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap;}
  .wizard-step{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.03em;}
  .wizard-step .num{width:20px; height:20px; border-radius:50%; background:var(--line-soft); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:600; flex-shrink:0;}
  .wizard-step.active{color:var(--ink);}
  .wizard-step.active .num{background:var(--brass); color:var(--surface-dark);}
  .wizard-step.done .num{background:var(--sage); color:#fff;}
  .dash-hero{
    background:linear-gradient(135deg, var(--surface-dark) 0%, var(--surface-dark-2) 100%);
    border-radius:10px; padding:26px 28px; margin-bottom:28px; color:var(--text-on-dark);
  }
  .dash-hero-title{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--brass-soft); margin-bottom:16px;}
  .dash-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  @media (max-width:760px){ .dash-grid{grid-template-columns:repeat(2,1fr);} }
  .dash-item .dash-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-on-dark-soft); margin-bottom:6px;}
  .dash-item .dash-value{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--text-on-dark);}
  .dash-item .dash-value.warn{color:#E8A67A;}
  .doc-preview{width:100px; border-radius:4px; border:1px solid var(--line-soft); margin-top:8px; display:block;}

  .booking-row{background:var(--line-soft); border:1px solid var(--line-soft); border-radius:10px; padding:14px 16px; margin-bottom:10px; position:relative; overflow:visible;}
  .booking-status{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .booking-status.richiesta{background:var(--brass-soft); color:var(--brass-deep);}
  .booking-status.confermata{background:#DCE6DE; color:var(--sage);}
  .booking-status.rifiutata{background:#F1DAD1; color:var(--terracotta);}

  .calendar{max-width:420px;}
  .dashboard-section-card{
    background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:14px;
    padding:28px 32px; box-shadow:0 1px 3px rgba(28,26,23,0.05); margin-bottom:36px;
  }
  .cal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .cal-month{font-family:'Fraunces',serif; font-weight:600; font-size:14px; text-transform:capitalize;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cal-weekday{font-size:10px; text-align:center; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; padding-bottom:4px;}
  .cal-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12px; border-radius:3px; color:var(--ink);}
  .cal-cell-price{flex-direction:column; gap:1px; cursor:pointer; transition:outline .1s ease;}
  .cal-cell-price .cal-day-num{font-size:11px;}
  .cal-cell-price .cal-day-price{font-size:8px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);}
  .cal-cell-price.custom{background:var(--brass-soft);}
  .cal-cell-price.custom .cal-day-price{color:var(--brass-deep); font-weight:600;}
  .cal-cell-price:hover{outline:1.5px solid var(--brass);}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.booked{background:#F1DAD1; color:var(--terracotta); font-weight:600;}
  .cal-cell.pending{background:var(--brass-soft); color:var(--brass-deep); font-weight:600;}
  .cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--brass);}
  .cal-cell-click{cursor:pointer; transition:background .15s ease, outline .1s ease;}
  .cal-cell-click:hover{background:var(--line-soft);}
  .cal-cell-click.selected{outline:2px solid var(--brass); outline-offset:-2px; background:var(--brass-soft);}
  .cal-legend{display:flex; gap:14px; margin-top:10px; font-size:10.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .cal-legend .dot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle;}
  .cal-legend .dot.booked{background:var(--terracotta);}
  .cal-legend .dot.pending{background:var(--brass-deep);}
  .cal-day-detail{
    margin-top:16px; padding:14px 16px; background:var(--line-soft); border-radius:10px;
    animation:msgIn .25s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .cal-day-detail-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);
  }
  .cal-day-detail-item{display:flex; gap:9px; align-items:flex-start; padding:7px 4px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--ink); line-height:1.4; transition:background .15s ease;}
  .cal-day-detail-item:hover{background:var(--brass-soft);}
  .cal-day-detail-item .n-dot{width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0;}

  .msg-thread{
    max-height:340px; overflow-y:auto; border:1px solid var(--line-soft); border-radius:14px;
    padding:18px; margin-bottom:14px; background:var(--line-soft); display:flex; flex-direction:column; gap:10px;
  }
  .msg-bubble{max-width:74%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.45; background:var(--paper-raised); align-self:flex-start; border-bottom-left-radius:4px; opacity:0; transform:translateY(8px); animation:msgIn .35s cubic-bezier(.2,.7,.2,1) forwards;}
  .msg-bubble.own{align-self:flex-end; background:var(--brand-gradient); color:#fff; border-bottom-left-radius:14px; border-bottom-right-radius:4px;}
  @keyframes msgIn{ to{ opacity:1; transform:none; } }
  .msg-meta{font-size:10px; color:var(--ink-soft); margin-top:5px; font-family:'IBM Plex Mono',monospace; letter-spacing:.03em; display:flex; align-items:center; gap:5px;}
  .msg-bubble.own .msg-meta{color:rgba(255,255,255,.8); justify-content:flex-end;}
  .tick-wrap{display:inline-flex; align-items:center; flex-shrink:0;}
  .tick-wrap svg{display:block;}
  .tick-wrap .tick-read{display:none;}
  .tick-wrap.is-read .tick-sent{display:none;}
  .tick-wrap.is-read .tick-read{display:block; color:#fff;}
  .tick-wrap:not(.is-read) .tick-sent{color:rgba(255,255,255,.65);}
  .msg-form, .msg-form-booking{display:flex; gap:8px; margin-bottom:30px;}
  .msg-form input, .msg-form-booking input{flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; font-family:'IBM Plex Sans',sans-serif;}
  .send-btn{
    flex-shrink:0; width:42px; height:42px; border-radius:9px; border:none; cursor:pointer;
    background:var(--brand-gradient); color:#fff; display:flex; align-items:center; justify-content:center;
    transition:transform .15s;
  }
  .send-btn:hover{transform:translateY(-1px) scale(1.03);}
  .send-btn:active{transform:scale(.92) rotate(-6deg);}

/* ViverePM Tiffany / petrol redesign */
:root{--ink:#193832;--ink-soft:#73847e;--paper:#f4f8f6;--paper-raised:#fff;--brass:#0ABAB5;--brass-soft:#e0f7f4;--brass-deep:#078d89;--line:#dce9e4;--line-soft:#e8f0ed;--surface-dark:#10332f;--surface-dark-2:#17463f;--text-on-dark:#f2fffc;--text-on-dark-soft:#add3cb;--tiffany:#0ABAB5;--brand-gradient:linear-gradient(115deg,#0ABAB5,#49d7c8)}
body{background:var(--paper)}
.topnav{background:#fff;border-bottom:1px solid var(--line);padding:14px 30px;min-height:72px}
.topnav-brand{color:var(--surface-dark);font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:none}
.topnav-brand:before{content:'VIVERE PM  /  ';color:var(--brass-deep);letter-spacing:.12em}
.tab-btn{color:#53716a;border-color:var(--line);background:#f7faf9;border-radius:11px;font-weight:600}
.tab-btn:hover{color:var(--brass-deep);border-color:var(--brass)}
.tab-btn.active{color:#fff;background:var(--brass-deep);border-color:var(--brass-deep)}
.notif-btn{color:var(--surface-dark);border-color:var(--line)}
.app{grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{padding:28px 14px;background:linear-gradient(165deg,#10332f,#17463f);border-right:0}
.sidebar::before{height:4px}
.brand{font-family:'IBM Plex Sans',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.06em;color:#fff}

  ];

function readAndCompressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Autenticazione gestore (Supabase Auth) ----------
function autorizzaSessione(email){
  if(email && state.settings.gestoreEmail && email.toLowerCase()===state.settings.gestoreEmail.toLowerCase()){
    state.gestoreRole = 'admin';
    state.operatoreAttivo = null;
    state.gestoreAccessNegato = false;
    return true;
  }
  const op = getOperatoreByEmail(email);
  if(op){
    state.gestoreRole = 'operatore';
    state.operatoreAttivo = op;
    state.gestoreAccessNegato = false;
    return true;
  }
  // autenticato con Supabase ma non autorizzato su questa piattaforma
  state.gestoreRole = null;
  state.operatoreAttivo = null;
  state.gestoreAccessNegato = true;
  return false;
}

async function checkAuthSession(){
  if(!SUPABASE_CONFIGURED || SUPABASE_LIB_ERROR || !supabase) return;
  try{
    const { data } = await supabase.auth.getSession();
    if(data && data.session && data.session.user){
      state.gestoreAuthUser = data.session.user.email;
      if(autorizzaSessione(data.session.user.email)){
        state.gestoreUnlocked = true;
      } else {
        state.gestoreUnlocked = false;
      }
      render();
    }
  }catch(e){ /* nessuna sessione attiva, resta al login */ }

  supabase.auth.onAuthStateChange((event, session)=>{
    if(event === 'PASSWORD_RECOVERY'){
      const recEmail = (session && session.user && session.user.email || '').toLowerCase();
      if(state.settings.gestoreEmail && recEmail === state.settings.gestoreEmail.toLowerCase()){
        state.gestoreRecoveryMode = true;
      } else {
        state.ownerRecoveryMode = true;
        state.ownerRecoveryEmail = recEmail || null;
      }
      render();
    }
    if(event === 'SIGNED_IN' && session && session.user){
      state.gestoreAuthUser = session.user.email;
      state.gestoreUnlocked = autorizzaSessione(session.user.email);
    }
    if(event === 'SIGNED_OUT'){
      state.gestoreUnlocked = false;
      state.gestoreAuthUser = null;
      state.gestoreRole = null;
      state.operatoreAttivo = null;
    }
  });
}
async function signUpGestore(email, password){
  try{
    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error) throw error;
    state.settings.gestoreEmail = email;
    saveSettingsData();
    state.error = null;
    if(data && data.session){
      // conferma email disattivata sul progetto: accesso immediato
      state.gestoreUnlocked = true;
      state.gestoreAuthUser = email;
      state.gestoreRole = 'admin';
      state.operatoreAttivo = null;
    } else {
      // Supabase richiede la conferma via email prima di attivare l'account
      state.gestoreSetupFatto = true;
    }
    render();
  }catch(e){
    state.error = 'Impossibile creare l\'accesso: ' + (e && e.message ? e.message : 'errore sconosciuto');
    render();
  }
}
async function signInGestore(email, password){

}
async function signUpOperatore(email, password){
  const op = getOperatoreByEmail(email);
  if(!op){
    alert('Questa email non risulta autorizzata come operatore. Chiedi all\'amministratore di aggiungerti prima.');
    return;
  }
  try{
    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error) throw error;
    state.gestoreAuthUser = email;
    if(data && data.session){
      state.gestoreUnlocked = autorizzaSessione(email);
    } else {
      alert('Account creato. Se richiesto, controlla la tua email per confermarlo, poi accedi normalmente.');
      state.gestoreAuthMode = 'login';
    }
    render();
  }catch(e){
    alert('Impossibile creare l\'accesso: ' + (e && e.message ? e.message : 'errore sconosciuto'));

}
async function signOutGestore(){

  state.gestoreAuthUser = null;
  state.gestoreRole = null;
  state.operatoreAttivo = null;
  state.gestoreAccessNegato = false;
  render();
}
async function requestPasswordReset(email){
  try{
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), { redirectTo });
    if(error) throw error;

    alert('Richiesta di recupero non riuscita: ' + (e && e.message ? e.message : 'riprova più tardi'));

  }
}

async function cambiaEmailGestore(nuovaEmail){
  try{
    const { error } = await supabase.auth.updateUser({ email: nuovaEmail });
    if(error) throw error;
    state.settings.gestoreEmail = nuovaEmail;
    saveSettingsData();
    alert('Controlla la posta: ti abbiamo mandato un link di conferma al nuovo indirizzo (e forse anche al vecchio). L\'email cambierà davvero solo dopo aver confermato.');
    closeModal();
    render();
  }catch(e){
    alert('Non sono riuscita a cambiare l\'email: ' + (e && e.message ? e.message : 'riprova'));
  }
}

// ---------- Sistema ruoli e operatori ----------
function isAdmin(){ return state.gestoreRole === 'admin'; }
function getOperatoreByEmail(email){
  return state.operatori.find(o => (o.email||'').toLowerCase() === (email||'').toLowerCase() && o.attivo!==false);
}
function haModulo(nome){
  if(isAdmin()) return true;
  if(!state.operatoreAttivo) return false;
  return !!(state.operatoreAttivo.moduli && state.operatoreAttivo.moduli[nome]);
}
function immobileConsentito(propId){
  if(isAdmin()) return true;
  if(!state.operatoreAttivo) return false;
  if(state.operatoreAttivo.tuttiImmobili) return true;
  return (state.operatoreAttivo.immobiliConsentiti||[]).includes(propId);
}
function immobiliVisibili(){
  if(isAdmin()) return state.properties;
  return state.properties.filter(p => immobileConsentito(p.id));
}
function saveOperatore(data, editingId){
  if(editingId){
    const o = state.operatori.find(x=>x.id===editingId);
    Object.assign(o, data);
  } else {
    state.operatori.push({ id: uid(), attivo: true, ...data });
  }
  saveData();
}
function eliminaOperatore(id){
  if(!confirm('Rimuovere questo operatore? Non potrà più accedere.')) return;
  state.operatori = state.operatori.filter(o=>o.id!==id);
  saveData();
  render();
}

// ---------- Autenticazione vera dei proprietari (email + password, scelta dal proprietario) ----------
function getClienteByEmail(email){
  return state.clienti.find(c => (c.email||'').toLowerCase() === (email||'').toLowerCase());
}
async function loginOwner(email, password){
  try{
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) throw error;
    state.ownerAuth = { email };
    state.ownerPropId = null;
    state.error = null;
    render();
  }catch(e){
    alert('Email o password non corrette.');
  }
}
async function signUpOwner(email, password){
  const cliente = getClienteByEmail(email);
  if(!cliente){
    alert('Questa email non risulta registrata come proprietario. Chiedi all\'agenzia di aggiungerla prima nella tua scheda.');
    return;
  }
  try{
    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error) throw error;
    if(data && data.session){
      state.ownerAuth = { email };
      state.ownerPropId = null;
      state.error = null;
      state.ownerAuthMode = 'login';
    } else {
      alert('Accesso creato. Se richiesto, controlla la tua email per confermarlo, poi accedi normalmente.');
      state.ownerAuthMode = 'login';
    }
    render();
  }catch(e){
    alert('Impossibile creare l\'accesso: ' + (e && e.message ? e.message : 'errore sconosciuto'));
  }
}
async function logoutOwner(){
  try{ await supabase.auth.signOut(); }catch(e){}
  state.ownerAuth = null;
  state.ownerPropId = null;
  render();
}
async function requestPasswordResetOwner(email){
  try{
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
    if(error) throw error;
    state.ownerResetInviato = true;
    render();
  }catch(e){
    alert('Non sono riuscita a inviare l\'email di recupero: ' + (e && e.message ? e.message : 'riprova più tardi'));
  }
}
async function updatePasswordAfterRecoveryOwner(newPassword){
  try{
    const { error } = await supabase.auth.updateUser({ password: newPassword });
    if(error) throw error;
    state.ownerRecoveryMode = false;
    state.ownerAuth = { email: state.ownerRecoveryEmail };
    state.ownerRecoveryEmail = null;
    state.ownerPropId = null;
    render();
  }catch(e){
    alert('Non sono riuscita a impostare la nuova password: ' + (e && e.message ? e.message : 'riprova'));
  }
}

async function loadData(){
  if(!SUPABASE_CONFIGURED){
    state.loading = false;
    state.notConfigured = true;
    render();
    return;
  }
  if(SUPABASE_LIB_ERROR){
    state.loading = false;
    state.libError = true;
    render();
    return;
  }
  try{
    const { data, error } = await supabase.from('app_data').select('*').eq('id','main').single();
    if(error) throw error;
    state.properties = data.properties || [];
    state.clienti = data.clienti || [];
    state.settings = data.settings || {nomeAgenzia:'Property Manager', telefonoGestore:''};
    state.operatori = data.operatori || [];
    let codiciDaMigrare = false;
    state.properties.forEach(p=>{
      if(!p.catasto || !p.catasto.startsWith('IMM-')){ p.catasto = generaCodiceImmobile(); codiciDaMigrare = true; }
    });
    if(codiciDaMigrare) persistAll();
  }catch(e){
    state.properties = [];
    state.clienti = [];
    state.settings = {nomeAgenzia:'Property Manager', telefonoGestore:''};
    state.error = 'Impossibile connettersi al database. Controlla la configurazione Supabase (URL, chiave, tabella app_data).';
  }
  applyLinkParams();
  state.loading = false;
  render();
  subscribeRealtime();
}
async function persistAll(){
  if(!SUPABASE_CONFIGURED) return;
  try{
    const { error } = await supabase.from('app_data').update({
      properties: state.properties, clienti: state.clienti, settings: state.settings, operatori: state.operatori, updated_at: new Date().toISOString()
    }).eq('id','main');
    if(error) throw error;
    state.error = null;
  }catch(e){
    state.error = 'Salvataggio non riuscito: ' + (e && e.message ? e.message : 'errore sconosciuto') + '. Riprova tra poco.';
    render();
  }
}
async function saveData(){ return persistAll(); }
async function saveSettingsData(){ return persistAll(); }
function subscribeRealtime(){
  supabase.channel('app_data_live')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_data', filter:'id=eq.main' }, payload=>{
      state.properties = payload.new.properties || state.properties;
      state.clienti = payload.new.clienti || state.clienti;
      state.settings = payload.new.settings || state.settings;
      state.operatori = payload.new.operatori || state.operatori;
      render();
    })
    .subscribe();
}

function openModal(type, editing=null, propId=null, context=null){

}

function getCliente(p){
  return state.clienti.find(c=>c.id===p.clienteId) || null;
}
function saveCliente(data, editingId){
  if(editingId){
    const c = state.clienti.find(x=>x.id===editingId);
    Object.assign(c, data);
    return c;
  } else {
    const c = { id: 'cl_'+uid(), ...data };
    state.clienti.push(c);

  }

function deleteCliente(id){
  const haImmobili = state.properties.some(p=>p.clienteId===id);
  if(haImmobili){ alert('Non puoi eliminare questo cliente: ha ancora immobili collegati. Elimina prima gli immobili o assegnali a un altro cliente.'); return; }
  if(!confirm('Eliminare definitivamente questo cliente?')) return;
  state.clienti = state.clienti.filter(c=>c.id!==id);
  saveData(); render();
}
function removeClienteDocumento(clienteId, index){
  const c = state.clienti.find(x=>x.id===clienteId);
  if(!c || !c.documenti) return;
  c.documenti.splice(index,1);
  saveData();
  openModal('cliente', c, null);
}

function saveProperty(data, editingId){
  if(editingId){
    const p = state.properties.find(x=>x.id===editingId);
    Object.assign(p, data);
  } else {
    state.properties.push({
      id: uid(),
      ...data,
      catasto: generaCodiceImmobile(),
      spese: [],
      manutenzioni: [],
      prenotazioni: [],
      tariffePersonalizzate: {},
      notteMinima: 1,
      prezziSettimanali: {},
      servizi: [],
      contrattoGestione: null,
      versamentiProprietario: [],
      controlli: [],
      periodicitaControlli: 2,
      listinoServizi: []
    });
  }
  saveData(); closeModal(); render();
}
function deleteProperty(id){
  if(!confirm('Eliminare definitivamente questo immobile e tutti i suoi dati?')) return;
  state.properties = state.properties.filter(p=>p.id!==id);
  if(state.selectedId===id) state.selectedId=null;
  saveData(); render();
}

// ---------- Expense CRUD ----------
function logStoricoSpesa(e, testo){
  if(!e.storico) e.storico = [];
  e.storico.push({data:new Date().toISOString(), testo});
}
function saveExpense(propId, data, editingId){
  const p = state.properties.find(x=>x.id===propId);

    Object.assign(p.spese.find(s=>s.id===editingId), data);
  } else {
    const e = {id:uid(), stato:'in-attesa', ricevuta:null, storico:[], ...data};
    logStoricoSpesa(e, 'Spesa registrata, in attesa di approvazione del proprietario.');
    p.spese.push(e);
    addNotifica(p, `Nuova spesa da approvare: ${fmtCurrency(e.importo)}${e.categoria?(' — '+e.categoria):''}.`, 'proprietario', 'spese');
  }
  saveData(); closeModal(); render();
}
function deleteExpense(propId, expId){
  const p = state.properties.find(x=>x.id===propId);
  p.spese = p.spese.filter(s=>s.id!==expId);
  saveData(); render();
}
function rispondiSpesa(propId, expId, esito){
  const p = state.properties.find(x=>x.id===propId);
  const e = p.spese.find(x=>x.id===expId);
  e.stato = esito;
  logStoricoSpesa(e, esito==='approvata' ? 'Spesa approvata dal proprietario.' : 'Spesa rifiutata dal proprietario.');

  addNotifica(p, `Il proprietario ha ${esito==='approvata'?'approvato':'rifiutato'} la spesa di ${fmtCurrency(e.importo)}.`, 'gestore', 'spese');

}
function pagaSpesa(propId, expId, data){
  const p = state.properties.find(x=>x.id===propId);
  const e = p.spese.find(x=>x.id===expId);
  e.stato = 'pagata';
  if(data.ricevuta) e.ricevuta = data.ricevuta;
  logStoricoSpesa(e, `Spesa pagata.${data.ricevuta ? ' Ricevuta caricata.' : ''}`);
  addNotifica(p, `La tua spesa di ${fmtCurrency(e.importo)} è stata pagata dall'agenzia.`, 'proprietario', 'spese');

// ---------- Interventi (segnalazione → preventivo → approvazione → completamento) ----------
function logStorico(m, testo){
  if(!m.storico) m.storico = [];
  m.storico.push({data: new Date().toISOString(), testo});
}
function saveMaintenance(propId, data, editingId){
  const p = state.properties.find(x=>x.id===propId);
  let risultato;
  if(editingId){
    risultato = p.manutenzioni.find(m=>m.id===editingId);
    Object.assign(risultato, data);
  } else {
    const m = {id:uid(), stato:'programmata', preventivo:null, fotoDopo:[], fattura:null, storico:[], dataProgrammazione:null, ...data};
    const dettagli = [m.tipologia, m.urgenza?('urgenza '+m.urgenza.toLowerCase()):null].filter(Boolean).join(', ');
    logStorico(m, `Intervento segnalato${m.richiedente?(' da '+m.richiedente):''}${dettagli?(' — '+dettagli):''}.`);
    p.manutenzioni.push(m);
    risultato = m;
    if(m.richiedente==='Proprietario') addNotifica(p, `Il proprietario ha segnalato un problema${m.tipologia?(': '+m.tipologia):''}.`, 'gestore', 'interventi');
    else addNotifica(p, `Nuovo intervento registrato dal gestore${m.tipologia?(': '+m.tipologia):''}.`, 'proprietario', 'interventi');
  }
  saveData(); closeModal(); render();
  return risultato;
}
function linkInterventoAControllo(propId, controlloId, voceText, interventoId){
  const p = state.properties.find(x=>x.id===propId);
  const c = (p.controlli||[]).find(x=>x.id===controlloId);
  if(!c || !c.checklist) return;
  const v = c.checklist.find(x=>x.voce===voceText);
  if(v){ v.interventoId = interventoId; saveData(); render(); }
}
function deleteMaintenance(propId, mId){
  const p = state.properties.find(x=>x.id===propId);
  p.manutenzioni = p.manutenzioni.filter(m=>m.id!==mId);
  saveData(); render();
}
function cycleMaintenanceStatus(propId, mId){
  const p = state.properties.find(x=>x.id===propId);
  const m = p.manutenzioni.find(x=>x.id===mId);
  const order = ['programmata','in-corso','completata'];
  m.stato = order[(order.indexOf(m.stato)+1) % order.length];
  saveData(); render();
}
function addPreventivo(propId, mId, data){
  const p = state.properties.find(x=>x.id===propId);
  const m = p.manutenzioni.find(x=>x.id===mId);
  m.preventivo = { fornitore:data.fornitore, importo:data.importo, note:data.note, stato:'in-attesa' };
  logStorico(m, `Preventivo inviato: ${data.fornitore} — ${fmtCurrency(data.importo)}.`);
  addNotifica(p, `Nuovo preventivo da approvare: ${data.fornitore} — ${fmtCurrency(data.importo)}.`, 'proprietario', 'interventi');
  saveData(); closeModal(); render();
}
function rispondiPreventivo(propId, mId, esito){
  const p = state.properties.find(x=>x.id===propId);
  const m = p.manutenzioni.find(x=>x.id===mId);
  m.preventivo.stato = esito;
  if(esito==='approvato'){ m.stato='in-corso'; logStorico(m, 'Preventivo approvato dal proprietario.'); }
  else { logStorico(m, 'Preventivo rifiutato dal proprietario.'); }
  flashStamp('preventivo:'+mId, esito==='approvato'?'ok':'crit');
  addNotifica(p, `Il proprietario ha ${esito==='approvato'?'approvato':'rifiutato'} il preventivo di ${m.preventivo.fornitore}.`, 'gestore', 'interventi');
  saveData(); render();

function programmaIntervento(propId, mId, data){
  const p = state.properties.find(x=>x.id===propId);
  const m = p.manutenzioni.find(x=>x.id===mId);
  m.dataProgrammazione = data;
  logStorico(m, `Intervento programmato per il ${fmtDate(data)}.`);
  saveData(); render();
}
function addFotoIntervento(propId, mId, data){
  const p = state.properties.find(x=>x.id===propId);
  const m = p.manutenzioni.find(x=>x.id===mId);
  if(!m.foto) m.foto = [];
  m.foto.push({id:uid(), url:data.url, descrizione:data.descrizione||''});
  saveData(); closeModal(); render();

function removeFotoIntervento(propId, mId, fotoId){
  const p = state.properties.find(x=>x.id===propId);
  const m = p.manutenzioni.find(x=>x.id===mId);
  m.foto = (m.foto||[]).filter(f=>typeof f!=='object' || f.id!==fotoId);

function completaIntervento(propId, mId, data){
  const p = state.properties.find(x=>x.id===propId);
  const m = p.manutenzioni.find(x=>x.id===mId);
  m.stato = 'completata';
  m.fotoDopo = (m.fotoDopo||[]).concat(data.fotoDopo||[]);

// ---------- Guadagno proprietario & versamenti ----------
function calcolaDashboard(p){
  const oggi = new Date();
  const meseCorrente = oggi.getMonth(), annoCorrente = oggi.getFullYear();
  const giorniNelMese = new Date(annoCorrente, meseCorrente+1, 0).getDate();

  // stato generale
  const interventiAperti = (p.manutenzioni||[]).filter(m=>m.stato!=='completata');
  const preventiviInAttesa = (p.manutenzioni||[]).filter(m=>m.preventivo && m.preventivo.stato==='in-attesa').length;
  const prossimoControllo = calcProssimoControllo(p);
  let stato = 'Tutto regolare';
  if(preventiviInAttesa>0) stato = `${preventiviInAttesa} preventivo${preventiviInAttesa>1?'i':''} da approvare`;
  else if(interventiAperti.length>0) stato = `${interventiAperti.length} intervento${interventiAperti.length>1?'i':''} in corso`;
  else if(prossimoControllo.inRitardo) stato = 'Controllo periodico in ritardo';

  // occupazione mese corrente (solo per prenotabili brevi)
  let occupazione = null;
  if(p.disponibilePrenotazioni){
    const {confirmed} = getBookedDaysMap(p.prenotazioni);
    let giorniOccupati = 0;
    for(let d=1; d<=giorniNelMese; d++){
      const key = `${annoCorrente}-${String(meseCorrente+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(confirmed.has(key)) giorniOccupati++;
    }
    occupazione = Math.round((giorniOccupati/giorniNelMese)*100);
  } else if(p.locazione && p.locazione.attivo){
    occupazione = 100;
  }

  // ricavi del mese corrente
  let ricaviMese = 0;
  (p.prenotazioni||[]).filter(b=>b.stato==='confermata').forEach(b=>{
    const ci = new Date(b.checkin);
    if(ci.getMonth()===meseCorrente && ci.getFullYear()===annoCorrente) ricaviMese += Number(b.totale||0);
  });
  if(p.locazione && p.locazione.attivo){
    (p.locazione.pagamenti||[]).forEach(pay=>{
      const d = new Date(pay.data);
      if(d.getMonth()===meseCorrente && d.getFullYear()===annoCorrente) ricaviMese += Number(pay.importo||0);
    });
  }

  // prossimo soggiorno
  const prossime = (p.prenotazioni||[]).filter(b=>b.stato==='confermata' && new Date(b.checkin) >= oggi).sort((a,b)=>new Date(a.checkin)-new Date(b.checkin));
  const prossimoSoggiorno = prossime.length ? prossime[0].checkin : null;

  return { stato, occupazione, ricaviMese, prossimoSoggiorno, preventiviInAttesa, controlloInRitardo: prossimoControllo.inRitardo };
}

function scaricaReport(p){
  const g = calcolaGuadagnoProprietario(p);
  const d = calcolaDashboard(p);
  const oggi = new Date().toLocaleDateString('it-IT',{month:'long', year:'numeric'});
  const righe = [
    `REPORT — ${p.nome}`,
    `Periodo: ${oggi}`,
    ``,
    `Stato: ${d.stato}`,
    d.occupazione!==null ? `Occupazione mese: ${d.occupazione}%` : '',
    `Ricavi del mese: ${fmtCurrency(d.ricaviMese)}`,
    d.prossimoSoggiorno ? `Prossimo soggiorno: ${fmtDate(d.prossimoSoggiorno)}` : '',
    ``,
    `Ricavi totali: ${fmtCurrency(g.ricaviTotali)}`,
    `Percentuale riconosciuta: ${g.percentuale}%`,
    `Guadagno maturato: ${fmtCurrency(g.guadagnoMaturato)}`,
    `Già versato: ${fmtCurrency(g.versato)}`,
    `Saldo in sospeso: ${fmtCurrency(g.saldoInSospeso)}`,
    ``,
    `Interventi registrati: ${(p.manutenzioni||[]).length}`,
    `Controlli periodici effettuati: ${(p.controlli||[]).length}`,
  ].filter(Boolean).join('\n');
  const blob = new Blob([righe], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `report-${p.nome.replace(/[^a-z0-9]/gi,'-').toLowerCase()}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function calcolaGuadagnoProprietario(p){
  const ricaviLocazione = ((p.locazione && p.locazione.pagamenti) || []).reduce((s,x)=>s+Number(x.importo||0),0);
  const ricaviPrenotazioni = (p.prenotazioni||[]).filter(b=>b.stato==='confermata').reduce((s,b)=>s+Number(b.totale||0),0);
  const ricaviTotali = ricaviLocazione + ricaviPrenotazioni;
  const percentuale = (p.percentualeProprietario !== undefined && p.percentualeProprietario !== null && p.percentualeProprietario !== '') ? Number(p.percentualeProprietario) : 100;
  const guadagnoMaturato = ricaviTotali * (percentuale/100);
  const versato = (p.versamentiProprietario||[]).reduce((s,v)=>s+Number(v.importo||0),0);
  const saldoInSospeso = guadagnoMaturato - versato;
  return {ricaviTotali, percentuale, guadagnoMaturato, versato, saldoInSospeso};
}
function calcolaCommissioneMensile(p, mesi){
  const now = new Date();
  const percentuale = (p.percentualeProprietario !== undefined && p.percentualeProprietario !== null && p.percentualeProprietario !== '') ? Number(p.percentualeProprietario) : 100;
  const quotaAgenzia = 1 - (percentuale/100);
  const risultati = [];
  for(let i = mesi-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    let ricavi = 0;
    (p.prenotazioni||[]).filter(b=>b.stato==='confermata').forEach(b=>{
      const ci = new Date(b.checkin);
      if(ci.getMonth()===d.getMonth() && ci.getFullYear()===d.getFullYear()) ricavi += Number(b.totale||0);
    });
    if(p.locazione && p.locazione.attivo){
      (p.locazione.pagamenti||[]).forEach(pay=>{
        const pd = new Date(pay.data);
        if(pd.getMonth()===d.getMonth() && pd.getFullYear()===d.getFullYear()) ricavi += Number(pay.importo||0);
      });
    }
    risultati.push({ label: d.toLocaleDateString('it-IT',{month:'short'}), commissione: Math.round(ricavi*quotaAgenzia) });
  }
  return risultati;
}
function renderGuadagnoChart(dati){
  const max = Math.max(...dati.map(d=>d.commissione), 1);
  const padL=20, padR=20, top=20, base=150, w=640;
  const n = dati.length;
  const stepX = n>1 ? (w-padL-padR)/(n-1) : 0;
  const pts = dati.map((d,i)=>({ x: padL+i*stepX, y: base-(Math.max(d.commissione,0)/max)*(base-top), ...d }));
  const linePath = pts.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[n-1].x.toFixed(1)},${base} L${pts[0].x.toFixed(1)},${base} Z`;
  const last = pts[n-1];
  const totale = dati.reduce((s,d)=>s+d.commissione,0);
  const media = Math.round(totale/n);
  const primo = dati[0].commissione;
  const trend = primo>0 ? Math.round(((last.commissione-primo)/primo)*100) : null;
  const labelsSvg = pts.map(pt=>`<text x="${pt.x.toFixed(1)}" y="172">${pt.label}</text>`).join('');
  const ariaDesc = dati.map(d=>d.label+': '+fmtCurrency(d.commissione)).join(', ');
  return `
    <div class="chart-card">
      <div class="chart-head">
        <h4>Commissione agenzia · ultimi ${n} mesi</h4>
        <div class="chart-total num">${fmtCurrency(totale)}</div>
      </div>
      <svg viewBox="0 0 640 210" role="img" aria-label="Commissione agenzia mensile: ${ariaDesc}.">
        <defs>
          <linearGradient id="ggFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style="stop-color:var(--brass); stop-opacity:.3"/>
            <stop offset="100%" style="stop-color:var(--brass); stop-opacity:0"/>
          </linearGradient>
          <linearGradient id="ggLine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" style="stop-color:var(--brass-deep)"/>
            <stop offset="100%" style="stop-color:var(--brass)"/>
          </linearGradient>
        </defs>
        <g style="stroke:var(--line-soft); stroke-width:1;">
          <line x1="20" y1="20" x2="620" y2="20"/><line x1="20" y1="60" x2="620" y2="60"/>
          <line x1="20" y1="100" x2="620" y2="100"/><line x1="20" y1="150" x2="620" y2="150"/>
        </g>
        <path d="${areaPath}" fill="url(#ggFill)"/>
        <path d="${linePath}" fill="none" style="stroke:url(#ggLine); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round;"/>
        <g style="fill:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px;">${labelsSvg}</g>
        <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="8" fill="var(--brass)" opacity=".18"/>
        <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4" style="fill:var(--brass); stroke:var(--paper-raised); stroke-width:2;"/>
      </svg>
      <div class="chart-legend">
        <span>Media mensile <b class="num">${fmtCurrency(media)}</b></span>
        ${trend!==null ? `<span>Trend <b style="color:${trend>=0?'var(--sage)':'var(--terracotta)'};">${trend>=0?'+':''}${trend}% nel periodo</b></span>` : ''}
      </div>
    </div>
  `;
}

function calcolaMesiContratto(p){
  const inizio = p.contrattoGestione && p.contrattoGestione.dataInizio;
  if(!inizio) return 0;
  const d1 = new Date(inizio), d2 = new Date();
  let mesi = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(d2.getDate() < d1.getDate()) mesi--;
  return Math.max(0, mesi) + 1; // include il mese corrente
}
function calcolaGuadagnoAgenzia(p){
  const g = calcolaGuadagnoProprietario(p);
  const commissioneAgenzia = g.ricaviTotali - g.guadagnoMaturato;
  const mesiContratto = calcolaMesiContratto(p);
  const numInterventi = (p.manutenzioni||[]).length;
  const voci = (p.listinoServizi||[]).map(v=>{
    let importo = 0, dettaglio = '';
    if(v.periodicita==='mensile'){ importo = Number(v.costo||0)*mesiContratto; dettaglio = `${mesiContratto} mes${mesiContratto===1?'e':'i'} di contratto`; }
    else if(v.periodicita==='per-intervento'){ importo = Number(v.costo||0)*numInterventi; dettaglio = `${numInterventi} intervent${numInterventi===1?'o':'i'}`; }
    else { importo = Number(v.costo||0); dettaglio = 'una tantum'; }
    return { nome: v.nome, importo, dettaglio };
  });
  const totaleServizi = voci.reduce((s,v)=>s+v.importo,0);
  const totaleAgenzia = commissioneAgenzia + totaleServizi;
  return { commissioneAgenzia, voci, totaleServizi, totaleAgenzia, ricaviTotali: g.ricaviTotali };
}
